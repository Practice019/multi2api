components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 对话 API Key（/v1/*）。可按令牌配置模型白名单；被限制时列表与调用都只覆盖允许的模型。
    adminToken:
      type: http
      scheme: bearer
      description: 管理令牌（/admin/*、/status）。控制台登录会话同样可用。
  headers:
    XService:
      description: 实例身份标识。带这个头 = 响应确实由网关生成；缺失 = 请求没到网关（查反向代理 / 监听地址）。
      schema:
        type: string
        example: multi2api
  parameters:
    CacheControl:
      name: Cache-Control
      in: header
      required: false
      description: 可选的缓存指令；网关不缓存响应，声明它是为了显式表达这一语义。
      schema:
        type: string
        example: no-store
  schemas:
    ChatMessage:
      type: object
      required:
      - role
      properties:
        role:
          type: string
          enum:
          - system
          - user
          - assistant
          - tool
          - developer
          example: user
        content:
          oneOf:
          - type: string
          - type: array
            items:
              type: object
              additionalProperties: true
        name:
          type: string
      additionalProperties: true
    OpenAIChatRequest:
      type: object
      required:
      - model
      - messages
      properties:
        model:
          type: string
          example: workbuddy/auto
          description: 模型名。可带上游前缀（workbuddy/…、loomy/…）；不带前缀按默认上游解析。
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ChatMessage'
        stream:
          type: boolean
          default: false
        temperature:
          type: number
          minimum: 0
          maximum: 2
        top_p:
          type: number
          minimum: 0
          maximum: 1
        max_tokens:
          type: integer
          minimum: 1
        tools:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    OpenAIChatResponse:
      type: object
      required:
      - id
      - object
      - created
      - model
      - choices
      properties:
        id:
          type: string
          example: chatcmpl-gw-8f3c1a
        object:
          type: string
          example: chat.completion
        created:
          type: integer
          example: 1793504214
        model:
          type: string
          example: hy4-preview
        choices:
          type: array
          items:
            type: object
            required:
            - index
            - message
            properties:
              index:
                type: integer
                example: 0
              message:
                type: object
                properties:
                  role:
                    type: string
                    example: assistant
                  content:
                    type: string
                  reasoning_content:
                    type: string
                    description: 思考型上游的推理内容；无则为空串或省略。
              finish_reason:
                type:
                - string
                - 'null'
                enum:
                - stop
                - length
                - tool_calls
                - content_filter
                description: 结束原因；上游可能给 null（此时该字段缺省或为 null）。
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer
            completion_tokens_details:
              type: object
              additionalProperties: true
            prompt_tokens_details:
              type: object
              additionalProperties: true
          additionalProperties: true
      additionalProperties: true
    ImageGenerationRequest:
      type: object
      required:
      - model
      - prompt
      properties:
        model:
          type: string
          example: loomy/doubao-seedream-5-lite
        prompt:
          type: string
          minLength: 1
        size:
          type: string
          example: 1024x1024
        n:
          type: integer
          minimum: 1
          example: 1
        response_format:
          type: string
          enum:
          - url
          - b64_json
      additionalProperties: true
    ImageGenerationResponse:
      type: object
      required:
      - data
      properties:
        created:
          type: integer
        data:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                format: uri
              b64_json:
                type: string
              revised_prompt:
                type: string
            additionalProperties: true
      additionalProperties: true
    Model:
      type: object
      required:
      - id
      - object
      properties:
        id:
          type: string
          example: workbuddy/auto
        object:
          type: string
          example: model
        created:
          type: integer
        owned_by:
          type: string
          description: 所属上游标识；按脱敏配置可被抹掉。
          example: default
      additionalProperties: true
    ModelList:
      type: object
      required:
      - object
      - data
      properties:
        object:
          type: string
          example: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Model'
      additionalProperties: true
    OpenAIErrorDetail:
      type: object
      required:
      - message
      - type
      - code
      properties:
        message:
          type: string
        type:
          type: string
          example: api_error
        code:
          type: string
          example: invalid_request
      additionalProperties: true
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          oneOf:
          - type: string
            description: '管理端形态：{"error": "人类可读的一句话"}'
          - $ref: '#/components/schemas/OpenAIErrorDetail'
      additionalProperties: true
    HealthzResponse:
      type: object
      required:
      - healthy
      - total
      - service
      properties:
        healthy:
          type: integer
          example: 12
        total:
          type: integer
          example: 14
        service:
          type: string
          example: multi2api
      additionalProperties: true
    StatusResponse:
      type: object
      required:
      - total
      - healthy
      properties:
        accounts:
          type: array
          items:
            type: object
            additionalProperties: true
        total:
          type: integer
        healthy:
          type: integer
        cooling:
          type: integer
        disabled:
          type: integer
        in_flight_full:
          type: integer
        sticky_sessions:
          type: integer
        redis_mode:
          type: string
          example: noop
        providers:
          type: object
          additionalProperties: true
      additionalProperties: true
    SettingsResponse:
      type: object
      required:
      - settings
      properties:
        settings:
          type: object
          additionalProperties: true
          description: 全部设置键（通用 + 各上游专属）
        runtime_fields:
          type: array
          items:
            type: object
            additionalProperties: true
        restart_fields:
          type: array
          items:
            type: object
            additionalProperties: true
        request_log:
          type: object
          additionalProperties: true
      additionalProperties: true
    SettingsPatchRequest:
      type: object
      minProperties: 1
      additionalProperties:
        oneOf:
        - type: string
        - type: boolean
        - type: number
      description: 键→值的补丁对象：只需带要改的键，值可为字符串 / 布尔 / 数字。
    SettingsUpdateResponse:
      type: object
      required:
      - settings
      - applied
      properties:
        settings:
          type: object
          additionalProperties: true
        applied:
          type: array
          items:
            type: string
          description: 本次真正生效的键
        need_restart:
          type: array
          items:
            type: string
          description: 本次改动里需要重启才生效的键
        request_log:
          type: object
          additionalProperties: true
      additionalProperties: true
    Channel:
      type: object
      required:
      - id
      - name
      - base_url
      properties:
        id:
          type: string
          example: ch-5d2c2b49
