        key_count:
          type: integer
        models:
          type: array
          items:
            type: string
        model_mapping:
          type: object
          additionalProperties:
            type: string
        group:
          type: string
        groups:
          type: array
          items:
            type: string
        priority:
          type: integer
        weight:
          type: integer
        status:
          type: integer
          enum:
          - 0
          - 1
        enabled:
          type: boolean
        balance:
          type: number
