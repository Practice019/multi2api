  responses:
    BadRequest:
      description: Bad Request：JSON 语法错误、缺少必填字段（如 model / prompt），或渠道保存时带了未登记字段。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            error:
              value:
                error:
                  message: 请求无效：JSON 语法错误、缺少必填字段（如 model / prompt），或渠道保存时带了未登记字段。
                  type: api_error
                  code: invalid_request
    Unauthorized:
      description: Unauthorized：缺少或无效的凭据（对话密钥 / 管理令牌）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            error:
              value:
                error:
                  message: 缺少或无效的凭据（对话密钥 / 管理令牌）。
                  type: api_error
                  code: invalid_request
    Forbidden:
      description: Forbidden：凭据有效但无权访问该模型或该端点（例如令牌的模型白名单不含该模型）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            error:
              value:
                error:
                  message: 凭据有效但无权访问该模型或该端点（例如令牌的模型白名单不含该模型）。
                  type: api_error
                  code: invalid_request
    RequestTooLarge:
      description: Payload Too Large：请求体超过上限（config.json 的 server.max_body_mb 可调）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            error:
              value:
                error:
                  message: 请求体超过上限（config.json 的 server.max_body_mb 可调）。
                  type: api_error
                  code: invalid_request
    TooManyRequests:
      description: Too Many Requests：上游限流或账号池暂无可用账号。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            error:
              value:
                error:
                  message: 上游限流或账号池暂无可用账号。
                  type: api_error
                  code: invalid_request
    ServerError:
      description: Internal Server Error：网关内部错误（例如保存后写入配置文件失败）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            error:
              value:
                error:
                  message: 网关内部错误（例如保存后写入配置文件失败）。
                  type: api_error
                  code: invalid_request
    NotImplemented:
      description: Not Implemented：该功能未接线（例如设置存储未启用）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            error:
              value:
                error:
                  message: 该功能未接线（例如设置存储未启用）。
                  type: api_error
                  code: invalid_request
    ServiceUnavailable:
      description: Service Unavailable：上游暂不可用 / 无可用账号，可稍后重试。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            error:
              value:
                error:
                  message: 上游暂不可用 / 无可用账号，可稍后重试。
                  type: api_error
                  code: invalid_request
    NotFound:
      description: Not Found：渠道不存在，或渠道功能未启用（store 未接线）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            error:
              value:
                error: '渠道不存在: ch-5d2c2b49'
    BadGateway:
      description: Bad Gateway：向上游查询失败（Base URL 不是 OpenAI 兼容端点 / key 无效）。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            error:
              value:
                error: '向上游查询模型失败: dial tcp: connection refused'
                hint: 检查 Base URL 是否指向 OpenAI 兼容端点（通常以 /v1 结尾）与 key 是否有效
  examples: {}
