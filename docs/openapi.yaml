  /admin/channels/keys:
    get:
      operationId: getAdminChannelsKeys
      tags:
      - Admin Channels
      summary: 列出渠道的 key
      description: 按渠道 id 列出各把 key 的视图（含打码值、状态、停用原因）。
      security:
      - adminToken: []
      parameters:
      - name: id
        in: query
        required: false
        description: 渠道 id
        schema:
          type: string
        example: ch-5d2c2b49
      responses:
        '200':
          description: key 视图列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelKeysListResponse'
              examples:
                success:
                  value:
                    id: ch-5d2c2b49
                    name: opencsg
                    keys:
                    - key: gk_abc…1234
                      status: 1
                    key_count: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/channels/search:
    get:
      operationId: getAdminChannelsSearch
      tags:
      - Admin Channels
      summary: 搜索渠道
      description: 与列表同族：tag_mode 非空时 keyword 按标签全等匹配（否则会把同前缀的其它标签也带进来）。
      security:
      - adminToken: []
      parameters:
      - name: page
        in: query
        required: false
        description: 页码（从 1 开始）
        schema:
          type: integer
        example: 1
      - name: page_size
        in: query
        required: false
        description: 每页条数
        schema:
          type: integer
        example: 20
      - name: status
        in: query
        required: false
        description: -1 不过滤 / 0 未启用（2+3 合并）/ 1,2,3 精确
        schema:
          type: integer
          enum:
          - -1
          - 0
          - 1
          - 2
          - 3
        example: 1
      - name: type
        in: query
        required: false
        description: -1 不过滤 / 否则精确匹配渠道类型
        schema:
          type: integer
        example: -1
      - name: keyword
        in: query
        required: false
        description: 关键词（tag_mode 非空时按标签全等匹配）
        schema:
          type: string
        example: opencsg
      - name: group
        in: query
        required: false
        description: 分组精确匹配
        schema:
          type: string
        example: default
      - name: tag_mode
        in: query
        required: false
        description: 非空 = 把 keyword 当标签全等匹配
        schema:
          type: string
        example: ''
      - name: sort_by
        in: query
        required: false
        description: 排序维度
        schema:
          type: string
          enum:
          - priority
          - id
          - name
          - balance
          - response_time
          - test_time
        example: priority
      - name: sort_order
        in: query
        required: false
        description: 排序方向
        schema:
          type: string
          enum:
          - asc
          - desc
        example: desc
      responses:
        '200':
          description: 搜索结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
