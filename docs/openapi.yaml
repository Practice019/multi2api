openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: multi2api 网关 HTTP API
  version: 1.0.0
  summary: 上游账号池 / 渠道转发网关的对外与管理接口
  description: 本项目的全部 HTTP 接口契约：对外 OpenAI 兼容接口（/v1/*）与管理端接口（/admin/*）。契约由源码路由表与 Go struct 的 json tag 抽取而成；标着「端点存在性占位」的操作只保证路径存在，字段级契约尚未逐项核对。HTML 控制台页面（/ui、/favicon、/）不属于 API 契约范围。
  contact:
    name: multi2api 维护者
    url: https://github.com/Practice019/multi2api
    email: maintainer@example.invalid
  license:
    name: Private / All rights reserved
    url: https://github.com/Practice019/multi2api
  x-api-id: multi2api
  x-summary: 上游账号池与渠道转发网关：OpenAI 兼容对外接口 + 管理端接口
externalDocs:
  description: 项目仓库与运维说明
  url: https://github.com/Practice019/multi2api
servers:
- url: http://127.0.0.1:7860
  description: 本机默认监听地址（config.json 的 server.listen 可改）
tags:
- name: Admin Accounts
  description: 管理端：账号池
- name: Admin Apikeys
  description: 管理端：apikeys
- name: Admin Channels
  description: 管理端：渠道（Key 型上游）
- name: Admin Groups
  description: 管理端：groups
- name: Admin Login
  description: 管理端：login
- name: Admin Logs
  description: 管理端：logs
- name: Admin Models
  description: 管理端：模型目录
- name: Admin Providers
  description: 管理端：providers
- name: Admin Schedule
  description: 管理端：schedule
- name: Admin Settings
  description: 管理端：设置读写
- name: Admin Stats
  description: 管理端：统计
- name: Admin System Status
  description: 管理端：系统状态
- name: Admin Task
  description: 管理端：task
- name: Admin Tokens
  description: 管理端：tokens
- name: Admin UI
  description: 管理端：ui
- name: Console UI
  description: 控制台 JSON 取数（HTML 页面本身不在本契约范围内）
- name: Misc
  description: 探针与状态
- name: V1
  description: 对外 OpenAI 兼容接口（Bearer：对话密钥）
security:
- adminToken: []
webhooks: {}
paths:
  /v1/chat/completions:
    post:
      operationId: postV1ChatCompletions
      tags:
      - V1
      summary: OpenAI 兼容的对话补全（流式 / 非流式）
      description: '请求体除「破甲注入」与「model 前缀剥离」外整体转发上游，因此下列字段之外还可带任意 OpenAI 参数。stream=true 返回 text/event-stream：每帧一条 choices[].delta 增量，最后一帧 data: [DONE]。'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAIChatRequest'
            examples:
              non_stream:
                value:
                  model: workbuddy/auto
                  messages:
                  - role: system
                    content: You are a helpful assistant.
                  - role: user
                    content: 用一句话说明什么是网关。
                  max_tokens: 512
                  temperature: 0.7
              stream:
                value:
                  model: workbuddy/auto
                  stream: true
                  messages:
                  - role: user
                    content: 数到三
      responses:
        '200':
          description: 成功：stream=false 为完整 JSON，stream=true 为 SSE。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIChatResponse'
              examples:
                completion:
                  value:
                    id: chatcmpl-gw-8f3c1a
                    object: chat.completion
                    created: 1793504214
                    model: hy4-preview
                    choices:
                    - index: 0
                      message:
                        role: assistant
                        content: 网关是上游账号池前面的一层代理。
                        reasoning_content: ''
                      finish_reason: stop
                    usage:
                      prompt_tokens: 42
                      completion_tokens: 18
                      total_tokens: 60
            text/event-stream:
              schema:
                type: string
              examples:
                sse:
                  value: 'data: {"choices":[{"delta":{"content":"网关"}}]}


                    data: {"choices":[{"delta":{},"finish_reason":"stop"}]}


                    data: [DONE]


                    '
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/images/generations:
    post:
      operationId: postV1ImagesGenerations
      tags:
      - V1
      summary: OpenAI 兼容的图片生成
      description: 模型前缀决定走上游（如 loomy/doubao-seedream-5-lite 走 loomy），与对话端点共用同一套前缀解析与令牌白名单判据。prompt 必填，其余生图参数透传上游。
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageGenerationRequest'
            examples:
              generate:
                value:
                  model: loomy/doubao-seedream-5-lite
                  prompt: 一只戴宇航头盔的柯基，扁平插画风
                  size: 1024x1024
                  n: 1
      responses:
        '200':
          description: 成功（上游 OpenAI 兼容生图结果透传）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageGenerationResponse'
              examples:
                success:
                  value:
                    created: 1793504300
                    data:
                    - url: https://example.invalid/images/img-8f3c1a.png
                      revised_prompt: A corgi wearing an astronaut helmet, flat illustration style
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/models:
    get:
      operationId: getV1Models
      tags:
      - V1
      summary: 列出可用模型
      description: OpenAI 风格的模型列表。列表会打上 X-Service 头，用来区分「响应来自网关」还是「来自前面的反向代理」。
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 可用模型目录：上游实时目录 ∪ 渠道声明的公开名，再按令牌白名单过滤。被限制的令牌只看到自己允许的模型（列表如实反映权限）。
          headers:
            X-Service:
              $ref: '#/components/headers/XService'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
              examples:
                list:
                  value:
                    object: list
                    data:
                    - id: workbuddy/auto
                      object: model
                      created: 1793504214
                      owned_by: default
                    - id: workbuddy/deepseek-v4-pro
                      object: model
                      created: 1793504214
                      owned_by: default
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
      parameters:
      - $ref: '#/components/parameters/CacheControl'
  /v1/model:
    get:
      operationId: getV1Model
      tags:
      - V1
      summary: 读取模型视图
      description: 与 GET /v1/models 是**同一个实现**（源码里两个路由指向同一个 handler），返回同一份目录。
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 可用模型目录：上游实时目录 ∪ 渠道声明的公开名，再按令牌白名单过滤。被限制的令牌只看到自己允许的模型（列表如实反映权限）。
          headers:
            X-Service:
              $ref: '#/components/headers/XService'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
              examples:
                list:
                  value:
                    object: list
                    data:
                    - id: workbuddy/auto
                      object: model
                      created: 1793504214
                      owned_by: default
                    - id: workbuddy/deepseek-v4-pro
                      object: model
                      created: 1793504214
                      owned_by: default
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /healthz:
    get:
      operationId: getHealthz
      tags:
      - Misc
      summary: 健康探针（无鉴权）
      description: 给负载均衡 / 编排用的探活端点：可受理 200，否则 503。判定口径与对话受理一致（账号池 ServableNow），避免把流量打进无法受理的实例。
      security: []
      responses:
        '200':
          description: 可受理请求。
          headers:
            X-Service:
              $ref: '#/components/headers/XService'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthzResponse'
              examples:
                healthy:
                  value:
                    healthy: 12
                    total: 14
                    service: multi2api
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: 暂不可受理（没有可立即服务的账号）。
          headers:
            X-Service:
              $ref: '#/components/headers/XService'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthzResponse'
              examples:
                degraded:
                  value:
                    healthy: 0
                    total: 14
                    service: multi2api
  /status:
    get:
      operationId: getStatus
      tags:
      - Misc
      summary: 控制台状态总览
      description: 账号池计数、粘性会话数、Redis 模式与上游级状态。控制台会话与管理令牌都可访问。
      security:
      - adminToken: []
      responses:
        '200':
          description: 账号池与上游状态。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              examples:
                success:
                  value:
                    accounts: []
                    total: 14
                    healthy: 12
                    cooling: 1
                    disabled: 1
                    in_flight_full: 0
                    sticky_sessions: 3
                    redis_mode: noop
                    providers: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /admin/settings:
    get:
      operationId: getAdminSettings
      tags:
      - Admin Settings
      summary: 读取全部设置
      description: 返回通用设置 + 各上游设置项，并区分「立即生效字段」与「需重启字段」以及请求日志统计。
      security:
      - adminToken: []
      responses:
        '200':
          description: 设置视图。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
              examples:
                success:
                  value:
                    settings:
                      prompt_armor_mode: 'off'
                      prompt_armor_retry: false
                      listen: :7860
                    runtime_fields: []
                    restart_fields: []
                    request_log:
                      count: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '501':
          $ref: '#/components/responses/NotImplemented'
    put:
      operationId: putAdminSettings
      tags:
      - Admin Settings
      summary: 保存设置（补丁式）
      description: 请求体是键→值的补丁对象，只带要改的键。返回本次真正生效的键与是否需重启；上游专属键由各上游扩展点各自认领。
      security:
      - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatchRequest'
            examples:
              armor_on:
                value:
                  prompt_armor_mode: append
                  prompt_armor_retry: true
      responses:
        '200':
          description: 保存结果。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsUpdateResponse'
              examples:
                success:
                  value:
                    settings:
                      prompt_armor_mode: append
                      prompt_armor_retry: true
                    applied:
                    - prompt_armor_mode
                    - prompt_armor_retry
                    need_restart: []
                    request_log:
                      count: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
        '501':
          $ref: '#/components/responses/NotImplemented'
  /admin/system-status:
    get:
      operationId: getAdminSystemStatus
      tags:
      - Admin System Status
      summary: 系统状态取数
      description: 状态页的唯一取数入口：宿主资源、进程运行时长、依赖健康、请求口径。端点存在性占位：路径从源码里 h.register / mux.HandleFunc 抽取；字段级契约尚未逐项核对。
      security:
      - adminToken: []
      responses:
        '200':
          description: 系统状态对象。
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /admin/channels:
    get:
      operationId: getAdminChannels
      tags:
      - Admin Channels
      summary: 列出渠道（分页 + 筛选 + 排序）
      description: 渠道列表。channels / items 同值（兼容字段）；type_counts 与 status_counts 给筛选器徽章用。
      security:
      - adminToken: []
      parameters:
      - name: page
        in: query
        required: false
        description: 页码（从 1 开始）
        schema:
          type: integer
        example: 1
      - name: page_size
        in: query
        required: false
        description: 每页条数
        schema:
          type: integer
        example: 20
      - name: status
        in: query
        required: false
        description: -1 不过滤 / 0 未启用（2+3 合并）/ 1,2,3 精确
        schema:
          type: integer
          enum:
          - -1
          - 0
          - 1
          - 2
          - 3
        example: 1
      - name: type
        in: query
        required: false
        description: -1 不过滤 / 否则精确匹配渠道类型
        schema:
          type: integer
        example: -1
      - name: keyword
        in: query
        required: false
        description: 关键词（tag_mode 非空时按标签全等匹配）
        schema:
          type: string
        example: opencsg
      - name: group
        in: query
        required: false
        description: 分组精确匹配
        schema:
          type: string
        example: default
      - name: tag_mode
        in: query
        required: false
        description: 非空 = 把 keyword 当标签全等匹配
        schema:
          type: string
        example: ''
      - name: sort_by
        in: query
        required: false
        description: 排序维度
        schema:
          type: string
          enum:
          - priority
          - id
          - name
          - balance
          - response_time
          - test_time
        example: priority
      - name: sort_order
        in: query
        required: false
        description: 排序方向
        schema:
          type: string
          enum:
          - asc
          - desc
        example: desc
      responses:
        '200':
          description: 渠道列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelListResponse'
              examples:
                success:
                  value:
                    channels:
                    - id: ch-5d2c2b49
                      name: opencsg
                      type: 0
                      base_url: https://opencsg.com/aigateway/v1
                      key_masks:
                      - gk_abc…1234
                      key_count: 1
                      models:
                      - deepseek-v4.1-flash-1017
                      group: default
                      groups:
                      - default
                      priority: 1
                      weight: 1
                      status: 1
                      enabled: true
                    total: 3
                    page: 1
                    page_size: 20
                    type_counts:
                      '0': 3
                    status_counts:
                      '1': 3
                    enabled: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: postAdminChannels
      tags:
      - Admin Channels
      summary: 新建 / 更新渠道
      description: 带 id 即更新、不带即新建。keys 在**请求体里是字符串数组**（存储形态才是对象数组）。未登记字段 fail-closed 拒绝（400 且回 rejected_fields）。
      security:
      - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelSaveRequest'
            examples:
              payload:
                value:
                  name: opencsg
                  type: 0
                  base_url: https://opencsg.com/aigateway/v1
                  keys:
                  - gk_xxxx
                  models:
                  - deepseek-v4.1-flash-1017
                  group: default
                  groups:
                  - default
                  priority: 1
                  weight: 1
                  status: 1
      responses:
        '200':
          description: 保存后的渠道（key 已打码）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelSaveResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/channels/delete:
    post:
      operationId: postAdminChannelsDelete
      tags:
      - Admin Channels
      summary: 删除渠道
      description: 按 id 删除；删除前会把它声明过的模型从 API key 的别名/白名单里清掉（避免留下指向不存在渠道的引用）。
      security:
      - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelIdRequest'
            examples:
              payload:
                value:
                  id: ch-5d2c2b49
      responses:
        '200':
          description: 删除结果（ok + 删除数量等）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelAckResponse'
              examples:
                success:
                  value:
                    ok: true
                    deleted: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/channels/status:
    post:
      operationId: postAdminChannelsStatus
      tags:
      - Admin Channels
      summary: 启用 / 停用渠道
      description: 按 id 切换状态，响应里带上变更前后状态。
      security:
      - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelStatusRequest'
            examples:
              payload:
                value:
                  id: ch-5d2c2b49
                  status: 1
      responses:
        '200':
          description: 变更结果（含前后状态）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelStatusChangeResponse'
              examples:
                success:
                  value:
                    ok: true
                    changed: true
                    status: 1
                    previous_status: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /admin/channels/reveal:
    post:
      operationId: postAdminChannelsReveal
      tags:
      - Admin Channels
      summary: 查看渠道 key 明文
      description: POST 但语义只读：只在管理令牌下回明文 key（列表与日志里永远是打码形式）。
      security:
      - adminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelIdRequest'
            examples:
              payload:
                value:
                  id: ch-5d2c2b49
      responses:
        '200':
          description: 渠道 id 与明文 key。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelRevealResponse'
              examples:
                success:
                  value:
                    id: ch-5d2c2b49
                    keys:
                    - gk_BYFV…9a6f4b2e
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/channels/discover:
    post:
      operationId: postAdminChannelsDiscover
      tags:
      - Admin Channels
      summary: 探测渠道可用模型
      description: 打到渠道的 Base URL 拉 /models（id 指已有渠道，或直接给 base_url + key）；可选 save 写回渠道。
      security:
      - adminToken: []
      requestBody:
        required: true
        content:
