<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>登录 · 控制台</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --fg: #1b1f24;
    --muted: #6b7280;
    --line: #e4e7eb;
    --accent: #2563eb;
    --accent-fg: #ffffff;
    --input-bg: #ffffff;
    --err-bg: #fdf2f2;
    --err-fg: #b42318;
    --err-line: #f3c3c0;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116;
      --card: #161a21;
      --fg: #e6e8eb;
      --muted: #98a1ab;
      --line: #262c35;
      --accent: #3b82f6;
      --accent-fg: #ffffff;
      --input-bg: #0f1319;
      --err-bg: #2a1618;
      --err-fg: #f3a6a1;
      --err-line: #5a2626;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .card {
    width: 100%;
    max-width: 336px;
    padding: 16px 16px 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  .head { display: flex; align-items: center; gap: 8px; }
  .logo { flex: none; color: var(--accent); }
  h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .01em; }
  .sub { margin: 6px 0 12px; font-size: 12.5px; color: var(--muted); }
  .field { display: block; margin: 0 0 9px; }
  .field > span { display: block; margin-bottom: 4px; font-size: 12px; color: var(--muted); }
  input {
    width: 100%;
    padding: 7px 9px;
    font: inherit;
    color: var(--fg);
    background: var(--input-bg);
    border: 1px solid var(--line);
    border-radius: 7px;
    outline: none;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.16); }
  input:disabled { opacity: .6; }
  .hint { margin: 0 0 10px; font-size: 11.5px; color: var(--muted); }
  /* 人机校验（T10）—— 一行高度固定：SVG 只许在这个高度里缩，不许把表单推走。
     沿用本项目既定口味（表单/表格一行高度固定、少留白），也沿用已有的
     --line / --muted / --input-bg 变量，不新增配色。 */
  .cap { margin-bottom: 9px; }
  .cap > label { display: block; margin-bottom: 4px; font-size: 12px; color: var(--muted); }
  .cap-line { display: flex; align-items: center; gap: 6px; }
  .cap-svg { flex: none; display: flex; align-items: center; height: 34px; }
  .cap-svg svg { display: block; height: 34px; width: auto; max-width: 148px; border: 1px solid var(--line); border-radius: 7px; background: var(--input-bg); }
  .cap-line input { width: 72px; flex: none; }
  .cap-line button.link { flex: none; white-space: nowrap; }
  .cap .hint { margin: 4px 0 0; }
  .alert {
    margin: 0 0 9px;
    padding: 7px 9px;
    font-size: 12.5px;
    color: var(--err-fg);
    background: var(--err-bg);
    border: 1px solid var(--err-line);
    border-radius: 7px;
    white-space: pre-wrap;
  }
  button.primary {
    width: 100%;
    padding: 8px 10px;
    font: inherit;
    font-weight: 600;
    color: var(--accent-fg);
    background: var(--accent);
    border: 0;
    border-radius: 7px;
    cursor: pointer;
  }
  button.primary:hover:not(:disabled) { filter: brightness(1.06); }
  button.primary:disabled { opacity: .7; cursor: default; }
  /* ⚠ `.switch`（原来给「没有账号，注册成员 ⇄ 已有账号，去登录」那一行用的）
   已随注册入口删除 —— 单账号口径下没有可切换的两边，留着是无主样式。 */
  button.link {
    padding: 0;
    font: inherit;
    color: var(--accent);
    background: none;
    border: 0;
    cursor: pointer;
    text-decoration: underline;
  }
  details { margin-top: 12px; padding-top: 9px; border-top: 1px dashed var(--line); }
  summary { font-size: 12px; color: var(--muted); cursor: pointer; }
  details p { margin: 7px 0 0; font-size: 11.5px; color: var(--muted); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
</style>
</head>
<body>
<main class="card">
  <div class="head">
    <svg class="logo" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <rect x="2" y="2" width="20" height="20" rx="6" fill="currentColor" opacity=".12"/>
      <path d="M8.4 11.4V9.2a3.6 3.6 0 0 1 7.2 0v2.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <rect x="6.6" y="11.4" width="10.8" height="7.4" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
    </svg>
    <h1 id="title">登录控制台</h1>
  </div>
  <p class="sub" id="sub">使用账号口令登录。</p>

  <form id="form" novalidate>
    <label class="field" for="username">
      <span>用户名</span>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="64" required aria-describedby="hint">
    </label>
    <label class="field" for="password">
      <span>口令</span>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required aria-describedby="hint">
    </label>
    <p class="hint" id="hint">用户名 3–32 位，可用字母、数字与 _ - . @；口令 8–128 位。</p>

    <!-- 人机校验（T10）。默认 hidden：服务端没开（404 captcha_disabled）或探不到
         就一直是隐藏的 —— **不留空框**。开了才由脚本显示出来并填上题面。 -->
    <div class="field cap" id="captchaRow" hidden>
      <label for="captcha">人机校验</label>
      <div class="cap-line">
        <!-- 题面是服务端生成的 SVG 字符串，由脚本用 innerHTML 插入这里。
             aria-hidden：读屏读不出算式字形，题面说明由下面的 captchaHint 给。 -->
        <span class="cap-svg" id="captchaSvg" aria-hidden="true"></span>
        <input id="captcha" name="captcha" type="text" inputmode="numeric" autocomplete="off"
               autocapitalize="off" autocorrect="off" spellcheck="false"
               pattern="[0-9]*" maxlength="6" aria-describedby="captchaHint">
        <button class="link" id="captchaRefresh" type="button">换一题</button>
      </div>
      <p class="hint" id="captchaHint">请输入图中算式的结果（只填数字）。</p>
    </div>

    <div class="alert" id="alert" role="alert" hidden></div>
    <button class="primary" id="submit" type="submit">登录</button>
  </form>

  <!-- ⚠ 2026-10-19 用户新口径：登录系统收成**单账号管理员**（"只要一个管理员就行了，
       只要一个账号。用户其实可以不用。"）⇒ 这里**不再有注册入口**。
       保留下来的只有一条线：账号库为空时创建**那一个**管理员（bootstrap）。
       §契约：未认证 /ui 的 HTML 里不许出现「注册」/「注册成员」/模式切换那一段
       —— 判据在 tests/frontend/verify_single_admin.js 第 4 条。 -->
  <details>
    <summary>脚本用户：用管理令牌访问</summary>
    <p>管理令牌 <code>admin_token</code> 可带 <code>Authorization: Bearer &lt;admin_token&gt;</code> 调管理接口；也可在浏览器打开 <code>/ui?token=&lt;admin_token&gt;</code> 换取一次性登录。</p>
  </details>
</main>

<script>
  window.__WB2API_LOGIN_FLAGS__ = {
    bootstrap: "__WB2API_LOGIN_BOOTSTRAP__"
  };
</script>
<script>
(function () {
  'use strict';

  var FLAGS = window.__WB2API_LOGIN_FLAGS__ || {};
  // ⚠ 只有 bootstrap 一个标志了（新口径：单账号管理员）。
  //   原来还有 `register`（库非空也能注册）与由它派生的 `CAN_SWITCH`（模式切换）
  //   —— 两条都在新口径下没有对应物：注册入口只在**首次**出现，就是 bootstrap 本身。
  var BOOTSTRAP = FLAGS.bootstrap === true;

  var TEXT = {
    bad_credentials: '用户名或口令不对',
    // ⚠ 只可能来自 bootstrap 的并发竞争（两个人同时开首次引导）：
    //   库非空之后就不再允许注册，所以这条文案不再是"注册"的错误文案，
    //   而是"这个首次创建被别人抢先了"。
    username_taken: '用户名已被占用',
    invalid_username: '用户名不合法（3–32 位，可用字母、数字与 _ - . @）',
    invalid_password: '口令不合法（8–128 位）',
    rate_limited: '请求太频繁（请稍后再试）',
    // ⚠ 新口径：成员账号已取消 ⇒ 登录被拒时的文案要指向"用管理员账号"。
    //   后端把退役账号归为 member_retired / bad_credentials，两种都落到这里。
    member_retired: '成员账号已取消，请用管理员账号登录',
    body_too_large: '请求过大',
    auth_required: '会话已失效，请重新登录',
    // 人机校验（T10）。服务端把"没带 / 答错 / 题过期"**都**回成同一个 code，
    // 所以这里不能写成"答案不对"那种区分 —— 那是服务端刻意不给的信息
    //（给了就等于告诉调用方"这个题号存在，只是答错了"）。
    captcha_required: '请完成人机校验后再试',
    captcha_disabled: '本部署未启用人机校验'
  };
  var FALLBACK = '请求失败，请稍后再试';
  var OFFLINE = '连不上服务端，请确认服务已启动后重试';

  var form = document.getElementById('form');
  var titleEl = document.getElementById('title');
  var subEl = document.getElementById('sub');
  var userEl = document.getElementById('username');
  var passEl = document.getElementById('password');
  var hintEl = document.getElementById('hint');
  var alertEl = document.getElementById('alert');
  var btn = document.getElementById('submit');
  // ⚠ switchRow/switchLink 已随注册入口一起删除（新口径：单账号管理员）。
  //   `applyMode` 里原来靠 `switchRow.hidden = !CAN_SWITCH` 控制它 —— 现在没有它了。
  var captchaRow = document.getElementById('captchaRow');
  var captchaSvg = document.getElementById('captchaSvg');
  var captchaEl = document.getElementById('captcha');
  var captchaRefresh = document.getElementById('captchaRefresh');

  // ⚠ 只有两种**形态**，不是一个"模式开关"：
  //   bootstrap —— 账号库为空时的**一次性**引导（创建那一个管理员）
  //   login     —— 管理员登录
  // 原来的 'register'（库非空也能注册出成员）在新口径下不存在，
  // 所以这里的取值改名为 'bootstrap'：名字必须与"它到底是什么"一致，
  // 否则下一个人看到 'register' 会以为还能注册。
  var mode = BOOTSTRAP ? 'bootstrap' : 'login';
  var busy = false;

  // 人机校验（T10）的两份状态，刻意分开：
  //   captchaId      当前题号。**空串 = 手上没题** ⇒ 提交时两个字段都不带。
  //                  它会因为"答过/答错/过期"作废（服务端一次性消费）。
  //   captchaEnabled 已知这个部署**开着**人机校验（探测成功过）。
  //                  答错之后靠它决定"要不要接着换题"，而不是靠 captchaId
  //                  （那时 captchaId 恰好还在，但题已经是废的）。
  var captchaId = '';
  var captchaEnabled = false;
  var captchaBusy = false;

  function labelOf(m) {
    return m === 'bootstrap' ? '创建第一个管理员' : '登录';
  }

  function showError(text) {
    alertEl.textContent = text;
    alertEl.hidden = false;
  }

  function clearError() {
    alertEl.textContent = '';
    alertEl.hidden = true;
  }

  function applyMode() {
    if (mode === 'bootstrap') {
      titleEl.textContent = '创建第一个管理员';
      subEl.textContent = '账号库为空，这个入口只在此时出现一次；创建后立即以该账号登录。';
      hintEl.textContent = '用户名 3–32 位，可用字母、数字与 _ - . @；口令 8–128 位。';
    } else {
      titleEl.textContent = '登录控制台';
      subEl.textContent = '使用管理员账号口令登录，管理上游账号与 API key。';
      hintEl.textContent = '用户名 3–32 位；口令 8–128 位。';
    }
    btn.textContent = labelOf(mode);
    // ⚠ 这里原来还有 `switchRow.hidden = !CAN_SWITCH` + 切换文案 ——
    //   注册入口已按用户新口径删除，没有可切换的另一边了。
  }

  function setBusy(on) {
    busy = on;
    btn.disabled = on;
    userEl.disabled = on;
    passEl.disabled = on;
    // 人机校验的两个控件也一起冻结（与其余输入框同一手势）：提交期间再点
    // 「换一题」会把刚提交的那道题换掉，而请求已经在路上了。
    captchaEl.disabled = on;
    captchaRefresh.disabled = on;
    btn.textContent = on ? '请稍候…' : labelOf(mode);
  }

  function messageOf(res) {
    if (res.network) return OFFLINE;
    var code = res.code || '';
    if (code === 'rate_limited' && res.retryAfter) {
      return '请求太频繁（请稍后再试，' + res.retryAfter + ' 秒后可重试）';
    }
    if (TEXT[code]) return TEXT[code];
    if (res.message) return res.message;
    var tail = res.status ? '（HTTP ' + res.status + '）' : '';
    return FALLBACK + tail;
  }

  // -------------------------------------------------------------------------
  // 人机校验（T10）
  // -------------------------------------------------------------------------

  // fetchCaptcha 取一道新题。只负责"发请求 + 把回执归一化"，
  // **不碰** DOM、不碰状态 —— 它有两个调用者（探测与换题），
  // 请求形状与判据只写一份。
  async function fetchCaptcha() {
    var res;
    try {
      res = await fetch('/admin/auth/captcha', {
        method: 'GET',
        credentials: 'same-origin',
        headers: { 'Accept': 'application/json' }
      });
    } catch (err) {
      return { ok: false, network: true };
    }
    var data = null;
    try { data = await res.json(); } catch (err) { data = null; }
    // 三个字段都得像样才算拿到题：只判 res.ok 的话，一个 200 + 空 id 的
    // 服务端会让页面显示一块空图 + 一个永远失败的问题。
    if (res.ok && data && data.ok === true &&
        typeof data.id === 'string' && data.id &&
        typeof data.svg === 'string' && data.svg) {
      return { ok: true, id: data.id, svg: data.svg };
    }
    var e = (data && data.error) || {};
    return { ok: false, status: res.status, code: e.code || '', message: e.message || '' };
  }

  // loadCaptcha 取一道新题并换到页面上的**唯一**入口。
  //
  // opts.quiet  true  = 失败不占用顶部错误条（首次探测、自动换题用）
  //             false = 失败给用户一条提示（用户点「换一题」时用），
  //                     但**不破坏页面**：题面留着、按钮恢复、可继续操作
  // opts.focus  拿到新题后把光标放进答案框
  //
  // 返回 true = 换到了新题。
  async function loadCaptcha(opts) {
    var o = opts || {};
    if (captchaBusy) return false;      // 防连点：同一时刻只允许一次换题
    captchaBusy = true;
    captchaRefresh.disabled = true;     // 钮先禁用，拿到新题/失败恢复
    var res = await fetchCaptcha();
    captchaBusy = false;
    captchaRefresh.disabled = false;

    if (res.ok) {
      captchaEnabled = true;
      captchaId = res.id;
      // ⚠⚠ 这里是**信任服务端**：`svg` 由服务端用字模自己拼出来，不含任何
      //    用户输入（见 internal/authlimit/captcha.go 的 drawQuestion）。
      //    所以直接 innerHTML（用 textContent 会把标签当文本显示出来）。
      //    将来若有人把 `svg` 改成用户可控的内容（例如允许管理员上传题目图
      //    片、或允许上游返回题面），这一行立刻变成 XSS 入口 —— 到那时必须
      //    改成白名单解析：DOMParser 解析后只放行 svg/rect/path 等允许的标签
      //    与属性，其余丢弃。
      captchaSvg.innerHTML = res.svg;
      captchaRow.hidden = false;
      captchaEl.value = '';
      if (o.focus) { try { captchaEl.focus(); } catch (err) {} }
      return true;
    }

    if (res.code === 'captcha_disabled') {
      // 这个部署没开人机校验：**整块隐藏**（不留空框），并且把状态清干净，
      // 让后续提交不带 captcha_* 字段。
      captchaEnabled = false;
      captchaId = '';
      captchaRow.hidden = true;
      if (!o.quiet) showError(messageOf(res));
      return false;
    }

    // 网络失败 / 其他状态：**不阻断登录** —— 登录本身可能还是通的
    //（服务端可能压根没开；真开着的话提交会拿到 captcha_required，
    //  那时再把它显示出来并换题）。
    if (!o.quiet) showError(messageOf(res));
    captchaRow.hidden = !captchaId;  // 手上有题就留着（可能还有效），没有就藏起来
    return false;
  }

  // askCaptcha 给"不关心返回值"的换题点用（探测 / 换一题 / 自动换题）：
  // loadCaptcha 内部已经处理了每一种失败，这里只是不让一个意外异常冒成
  // 未处理的 Promise 拒绝（那会表现为 console 报错 + 页面看起来卡住）。
  function askCaptcha(opts) {
    loadCaptcha(opts).catch(function () {});
  }

  // credsBody 组装注册/登录请求体。
  //
  // 人机校验字段的取舍（二选一并说明）：**有题号才带这两个字段**。
  //   · 没题时带 `captcha_id: ""` 只是把"没有题"伪装成"题号为空"，
  //     让服务端多一种要处理的输入；而这两个字段在服务端是**可选**的，
  //     "缺席"本来就是它认得的正常状态（严格解码只约束"字段名不能自创"）。
  //   · 有题时答案为空**照样带空串**：服务端对"缺失"与"答错"回同一个
  //     code（captcha_required），前端替它做"空 = 缺失"的推断只会掩盖
  //     "题号有效但答案是空"这种真实输入。
  function credsBody(username, password) {
    var body = { username: username, password: password };
    if (captchaId) {
      body.captcha_id = captchaId;
      body.captcha_answer = captchaEl.value.trim();
    }
    return body;
  }

  async function request(path, body) {
    var res;
    try {
      res = await fetch(path, {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    } catch (err) {
      return { ok: false, network: true };
    }
    var retryAfter = res.headers ? res.headers.get('Retry-After') : null;
    var data = null;
    try { data = await res.json(); } catch (err) { data = null; }
    if (res.ok && data && data.ok === true) return { ok: true };
    var e = (data && data.error) || {};
    return {
      ok: false,
      status: res.status,
      code: e.code || '',
      message: e.message || '',
      retryAfter: retryAfter
    };
  }

  // attempt 发一次提交。
  //
  // ⚠ 新口径（单账号管理员）下只剩两条路：
  //   'bootstrap' —— 账号库为空时创建**那一个**管理员（服务端同一端点
  //                  `/admin/auth/register`，但只在库空时受理）；
  //   'login'     —— 管理员登录。
  // 原来的第三种（库非空还能注册出成员）连同注册入口一起删除。
  async function attempt(action, username, password) {
    var path = action === 'bootstrap' ? '/admin/auth/register' : '/admin/auth/login';
    var res = await request(path, credsBody(username, password));
    if (!res.ok) return { text: messageOf(res), code: res.code };
    if (action === 'login') return { redirect: true };
    // 首次创建成功后的自动登录。⚠ 人机校验开着时，这道题**已经被创建那一步用掉了**
    //（服务端一次性消费），所以这里多半会拿到 captcha_required —— 不特判，
    // 交给调用方按"换个新题、请用户重登"处理（见提交处的 code 分支）。
    var login = await request('/admin/auth/login', credsBody(username, password));
    if (login.ok) return { redirect: true };
    return {
      text: '管理员创建成功，但自动登录未通过：' + messageOf(login) + '。请改用登录。',
      code: login.code,
      toLogin: true
    };
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (busy) return;
    var username = userEl.value.trim();
    var password = passEl.value;
    if (!username) { showError('请填写用户名'); userEl.focus(); return; }
    if (!password) { showError('请填写口令'); passEl.focus(); return; }
    clearError();
    setBusy(true);
    attempt(mode, username, password).then(function (result) {
      setBusy(false);
      if (result.redirect) {
        location.replace('/ui');
        return;
      }
      if (result.toLogin && mode !== 'login') {
        mode = 'login';
        applyMode();
      }
      showError(result.text);
      if (result.code === 'captcha_disabled') {
        // 该部署没开（配置被改过）：按普通错误展示，并隐藏整块。
        // **不**自创重试逻辑 —— 重试与否由用户在页面上决定。
        // 顺手把状态清干净：下面那条"顺手换题"因此不会发请求。
        captchaEnabled = false;
        captchaId = '';
        captchaRow.hidden = true;
      }
      // ★ 本轮提交**没结束**（走到这里就都是 2xx 以外的结果）⇒ 顺手换一题。
      //
      // 为什么是"任何失败"而不只是 captcha_required：服务端的 checkCaptcha 在
      // 口令校验**之前**跑（internal/account/http.go 的 login），所以一次提交
      // 无论答对、答错、还是口令错，手上那道题**都已经作废**了。不换的后果实测
      // 是这样：用户口令打错 → 401（题已废）→ 再点提交 → 先撞 captcha_required
      // → 才换题 → 又要答一次 —— 每次打错口令都白费一轮往返。
      //
      // 三处刻意的边界：
      //   · 成功（redirect）**不换**：页面马上跳走，换题是白发的请求；
      //   · captcha_disabled 那条已把 captchaEnabled 置 false，这里自然不换；
      //   · quiet:true ⇒ 换题失败**不会**盖掉真正的错误提示（用户最需要知道的
      //     是"口令不对"，不是"换题失败"）。
      //
      // 二选一里的哪一支：**由这一条统一承担换题**，captcha_required 不再单独
      // 处理。理由是两者本来就是同一件事 —— 这一轮用掉的题作废了（code 不同只
      // 说明服务端在流程的哪一步拦下），写在两处反而要各自记得别再换一次。
      if (captchaEnabled) askCaptcha({ quiet: true, focus: true });
    });
  });

  captchaRefresh.addEventListener('click', function () {
    // 用户主动换题：失败要给提示（quiet:false），但不破坏页面。
    askCaptcha({ quiet: false, focus: true });
  });

  // ⚠ 这里原来有 `switchLink` 的点击处理（登录 ⇄ 注册 切换）。
  //   注册入口已按用户新口径（单账号管理员）删除 ⇒ 没有可切换的另一边，整块删掉。
  //   删掉的是**入口**，不是能力：首次引导那条线由 `BOOTSTRAP` 直接决定 mode，
  //   不依赖用户点任何开关。

  applyMode();
  userEl.focus();
  // 探一次人机校验，决定那块显不显示：
  //   200            → 显示题面
  //   404 disabled   → 整块隐藏（quiet：不当错误）
  //   网络失败/其他   → 整块隐藏，但**不阻断登录**（提交时服务端真要题，
  //                    会回 captcha_required，那时再显示出来并换题）
  askCaptcha({ quiet: true });
})();
</script>
</body>
</html>
