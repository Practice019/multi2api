}

/* ── 抽屉：新建 / 编辑 ────────────────────────────────────────────────── */
var dlgState = { id: null, isNew: true, visualMap: false, save: false };

function openDrawer(id) {
  var ch = id ? rowById(id) : null;
  dlgState = { id: id || null, isNew: !id, visualMap: false, save: false };
  var host = $('host-dlg');
  var multi = !!(ch && ch.key_count > 1);
  host.innerHTML =
    '<div class="mask" id="dlg-mask"></div>' +
    '<div class="slide calm" role="dialog" aria-label="渠道编辑" id="dlg">' +
      '<div class="dh"><h2>' + (dlgState.isNew ? '新建渠道' : ('编辑渠道 · ' + esc(ch.name))) + '</h2>' +
        '<button class="mini x" id="dlg-x">关闭</button></div>' +

      '<div class="sec"><h3>① 基本信息</h3>' +
        '<div class="row"><label>类型</label><select class="sel" id="f-type">' +
          Object.keys(TYPE_NAMES).map(function (t) {
            var sel = String(ch ? ch.type : 0) === String(t) ? ' selected' : '';
            return '<option value="' + t + '"' + sel + '>' + TYPE_NAMES[t] + '</option>';
          }).join('') + '</select></div>' +
        '<div class="row"><label>名称 <span class="hint">必填</span></label><input class="ipt grow" id="f-name" value="' + esc(ch ? ch.name : '') + '"></div>' +
        (dlgState.isNew ?
          '<div class="row"><label>创建模式</label><select class="sel" id="f-mode">' +
            '<option value="single">单个创建（一份密钥 = 一条渠道）</option>' +
            '<option value="batch">批量创建（每行一个 key 建一条）</option>' +
            '<option value="multi_to_single">多 Key 合一（所有 key 合成一条渠道）</option>' +
          '</select><span class="hint">仅新建时出现</span></div>' : '') +
      '</div>' +

      '<div class="sec"><h3>② 密钥与连接</h3>' +
        '<div class="row"><label>密钥</label></div>' +
        '<div class="row"><textarea class="ta" id="f-keys" placeholder="' +
          (dlgState.isNew ? '一行一个 key（必填）' : '留空 = 不改动现有密钥；要替换请粘贴新 key') + '"></textarea></div>' +
        '<div class="row"><span class="hint">' + (dlgState.isNew ? '新建时必填。' : '编辑时留空即不改（后端语义：keys 不传 = 不动）。') +
          '批量创建模式下：每行一个 key 各建一条渠道。</span></div>' +
        '<div class="row"><label>API 地址</label><input class="ipt grow" id="f-base" value="' + esc(ch ? ch.base_url : '') + '" list="base-presets">' +
          '<datalist id="base-presets">' + BASE_PRESETS.map(function (b) { return '<option value="' + b + '"></option>'; }).join('') + '</datalist></div>' +
        '<div class="row"><label>多 Key 模式</label><select class="sel" id="f-kmode">' +
          ['', 'random', 'round_robin'].map(function (v) {
            var t = v === '' ? '默认（随机）' : (v === 'random' ? '随机' : '轮询');
            return '<option value="' + v + '"' + ((ch && ch.key_selection_mode === v) ? ' selected' : '') + '>' + t + '</option>';
          }).join('') + '</select><span class="hint">' + (multi ? '当前渠道是多 Key' : '仅多 Key 渠道生效') + '</span></div>' +
        '<div class="row"><span class="ro">高级字段（组织 / 类型专属项）：后端 channelFieldRegistry 尚未登记，本页不提交（提交会 400）。</span></div>' +
      '</div>' +

      '<div class="sec"><h3>③ 模型配置</h3>' +
        '<div class="row"><button class="mini" id="f-pull">从上游拉取</button>' +
          '<button class="mini" id="f-default">填入默认模型</button>' +
          '<button class="mini" id="f-clear">清除所有</button></div>' +
        '<div class="row"><textarea class="ta" id="f-models" placeholder="一行一个模型名">' + esc(ch ? (ch.models || []).join('\n') : '') + '</textarea></div>' +
        '<div class="row"><label>自定义模型名</label><input class="ipt" id="f-custom"><button class="mini" id="f-addc">填入</button></div>' +
        '<div class="row"><label>分组（逗号分隔）</label><input class="ipt grow" id="f-groups" value="' + esc(ch ? (ch.groups || []).join(',') : 'default') + '"></div>' +
        '<div class="row"><label>模型重定向</label><button class="mini" id="f-mtoggle">可视化</button>' +
          '<button class="mini" id="f-mgen">批量生成映射</button>' +
          '<label class="pill"><input type="checkbox" id="f-msync"> 同步别名到渠道模型列表</label></div>' +
        '<div class="row"><textarea class="ta" id="f-map" placeholder="{&quot;公开名&quot;:&quot;上游名&quot;}">' + esc(ch ? JSON.stringify(ch.model_mapping || {}, null, 1) : '{}') + '</textarea></div>' +
        '<div class="row" id="f-mapvis" hidden></div>' +
        '<div class="row"><span class="ro">是否自动禁用：后端尚未登记为可写字段（由测试路径维护），本页只读。</span></div>' +
      '</div>' +

      '<div class="sec"><h3>④ 高级与运行</h3>' +
        '<div class="row"><label>优先级</label><input class="ipt ipt--sm" id="f-pri" value="' + (ch ? ch.priority : 0) + '">' +
          '<label>权重 ≥0</label><input class="ipt ipt--sm" id="f-wt" value="' + (ch ? ch.weight : 0) + '"></div>' +
        (dlgState.isNew ? '<div class="row"><label>状态</label><select class="sel" id="f-st"><option value="1">启用</option><option value="2">禁用</option></select></div>' : '') +
        '<div class="row"><label>渠道标签</label><input class="ipt" id="f-tag" value="' + esc(ch ? (ch.tag || '') : '') + '">' +
          '<span class="hint">保存后按标签写（tag/batch）</span></div>' +
        '<div class="row"><span class="ro">测试模型 / 备注 / 参数覆盖 / 请求头覆盖 / 状态码复写：后端尚未登记，本页不提交。</span></div>' +
      '</div>' +

      '<div class="foot"><button class="tb tb--go" id="f-save">保存</button>' +
        '<button class="tb" id="f-cancel">取消</button><span class="grow"></span><span class="ro" id="f-status"></span></div>' +
    '</div>';

  $('dlg-x').addEventListener('click', closeDrawer);
  $('dlg-mask').addEventListener('click', closeDrawer);
  $('f-cancel').addEventListener('click', closeDrawer);
  $('f-save').addEventListener('click', saveDrawer);
  $('f-pull').addEventListener('click', function () { pullModels(); });
  $('f-default').addEventListener('click', function () { $('f-models').value = DEFAULT_MODELS.join('\n'); });
  $('f-clear').addEventListener('click', function () { $('f-models').value = ''; });
  $('f-addc').addEventListener('click', addCustomModel);
  $('f-mgen').addEventListener('click', genMapping);
  $('f-mtoggle').addEventListener('click', toggleMapView);
}
function closeDrawer() { closeHost($('host-dlg')); }

/* 「从上游拉取」：把发现到的模型填进文本框，**只在用户确认后**才覆盖现有列表。 */
function pullModels() {
  var body = { base_url: $('f-base').value.trim() };
  var keys = splitLines($('f-keys').value);
  if (keys.length) { body.keys = [keys[0]]; } else if (dlgState.id) { body.id = dlgState.id; }
  api('POST', '/admin/channels/discover', body).then(function (j) {
    var list = (j && (j.models || j.items)) || [];
    if (!list.length) { banner('err', '上游没有返回模型'); return; }
    if ($('f-models').value.trim() && !confirm('用上游返回的 ' + list.length + ' 个模型覆盖当前列表？')) { return; }
    $('f-models').value = list.join('\n');
  }).catch(function (e) { banner('err', '拉取失败：' + e.message); });
}
function splitLines(v) {
  return String(v || '').split(/[\r\n,]+/).map(function (s) { return s.trim(); }).filter(function (s) { return s; });
}
function addCustomModel() {
  var v = $('f-custom').value.trim();
  if (!v) { return; }
  var cur = splitLines($('f-models').value);
  if (cur.indexOf(v) < 0) { cur.push(v); }
  $('f-models').value = cur.join('\n');
  $('f-custom').value = '';
}
function genMapping() {
  var models = splitLines($('f-models').value);
  var m = {};
  try { m = JSON.parse($('f-map').value || '{}') || {}; } catch (e) { m = {}; }
  models.forEach(function (x) { if (!m[x]) { m[x] = x; } });
  $('f-map').value = JSON.stringify(m, null, 1);
  banner('ok', '已生成 ' + Object.keys(m).length + ' 条映射（同名为恒等映射）');
}
function toggleMapView() {
  dlgState.visualMap = !dlgState.visualMap;
  var vis = $('f-mapvis');
  if (!dlgState.visualMap) { vis.hidden = true; $('f-map').hidden = false; $('f-mtoggle').textContent = '可视化'; return; }
  var m = {};
  try { m = JSON.parse($('f-map').value || '{}') || {}; } catch (e) { m = {}; }
  var rows = Object.keys(m).map(function (k) {
    return '<div class="row"><input class="ipt ipt--sm mv-k" value="' + esc(k) + '"><span>=&gt;</span>' +
      '<input class="ipt ipt--sm mv-v" value="' + esc(m[k]) + '"></div>';
  }).join('');
  vis.innerHTML = rows + '<button class="mini" id="f-mapback">回到 JSON</button>';
  vis.hidden = false;
  $('f-map').hidden = true;
  $('f-mtoggle').textContent = '回到 JSON';
  $('f-mapback').addEventListener('click', function () {
    var out = {}, ks = vis.querySelectorAll('.mv-k'), vs = vis.querySelectorAll('.mv-v');
    for (var i = 0; i < ks.length; i++) { if (ks[i].value.trim()) { out[ks[i].value.trim()] = vs[i].value.trim(); } }
    $('f-map').value = JSON.stringify(out, null, 1);
    dlgState.visualMap = false; vis.hidden = true; $('f-map').hidden = false; $('f-mtoggle').textContent = '可视化';
  });
}

/* 保存：**只提交后端登记过的字段**（fail-closed，未登记字段一律 400）。
   mode / multi_key_mode 是**外层**字段（与渠道字段平级），不是嵌套对象。 */
function saveDrawer() {
  if (dlgState.save) { return; }
  var body = {
    type: Number($('f-type').value),
    name: $('f-name').value.trim(),
    base_url: $('f-base').value.trim(),
    models: splitLines($('f-models').value),
    groups: $('f-groups').value.split(',').map(function (s) { return s.trim(); }).filter(function (s) { return s; }),
    priority: parseInt($('f-pri').value, 10) || 0,
    weight: Math.max(0, parseInt($('f-wt').value, 10) || 0),
    model_mapping: parseMap()
  };
  if (body.model_mapping === null) { banner('err', '模型重定向不是合法 JSON'); return; }
  var keys = splitLines($('f-keys').value);
  if (dlgState.isNew && !keys.length) { banner('err', '新建时密钥必填'); return; }
  if (!body.name) { banner('err', '名称必填'); return; }
  if (keys.length) { body.keys = keys; body.key_mode = 'append'; }
  var ksel = $('f-kmode').value;
  if (ksel) { body.key_selection_mode = ksel; body.multi_key_mode = ksel; }
  if (dlgState.isNew) {
    body.mode = $('f-mode') ? $('f-mode').value : 'single';
    body.status = Number($('f-st') ? $('f-st').value : 1);
  } else {
    body.id = dlgState.id;
  }
  var tag = $('f-tag').value.trim();
  dlgState.save = true;
  $('f-save').disabled = true; $('f-cancel').disabled = true;
  $('f-status').textContent = '保存中…';
  api('POST', '/admin/channels', body).then(function () {
    if (!tag || dlgState.isNew) { return null; }
    return api('POST', '/admin/channels/tag/batch', { ids: [dlgState.id], tag: tag });
  }).then(function () {
    banner('ok', '已保存');
    closeDrawer();
    return load();
  }).catch(function (e) {
    banner('err', '保存失败：' + e.message);
  }).then(function () {
    dlgState.save = false;
    if ($('f-save')) { $('f-save').disabled = false; $('f-cancel').disabled = false; $('f-status').textContent = ''; }
  });
}
function parseMap() {
  var t = $('f-map').value.trim();
  if (!t) { return {}; }
  try { return JSON.parse(t) || {}; } catch (e) { return null; }
}
</script>
<script>
'use strict';
/* ── C2 渠道页脚本（第三段）：密钥管理 / 标签 / 拖动排序 / 启动 ── */

/* 密钥管理：四条端点都按**下标**动（不动别的 key）。
   列表只回掩码；明文只在"显示明文"这一下（GET keys?reveal=1）出现，且不写进任何缓存。 */
function openKeys(id) {
  var host = $('host-dlg');
  var ch = rowById(id);
  api('GET', '/admin/channels/keys?id=' + encodeURIComponent(id)).then(function (j) {
    var keys = (j && (j.keys || j.items)) || [];
    var rows = keys.map(function (k, i) {
      var kv = k || {};
      var stat = (kv.status === 1 || kv.status === undefined) ? '启用' : (kv.status === 3 ? '自动禁用' : '禁用');
      return '<tr data-kidx="' + i + '">' +
        '<td class="num">' + i + '</td>' +
        '<td class="c-id">' + esc(kv.mask || kv.key || '') + '</td>' +
        '<td>' + esc(stat) + (kv.reason ? ' <span class="ro">' + esc(kv.reason) + '</span>' : '') + '</td>' +
        '<td class="ops">' +
          '<button class="mini" data-kact="on" data-i="' + i + '">启用</button>' +
          '<button class="mini" data-kact="off" data-i="' + i + '">停用</button>' +
          '<button class="mini mini--danger" data-kact="del" data-i="' + i + '">删除</button>' +
        '</td></tr>';
    }).join('');
    host.innerHTML =
      '<div class="mask" id="k-mask"></div>' +
      '<div class="slide calm" role="dialog" aria-label="密钥管理">' +
        '<div class="dh"><h2>密钥管理 · ' + esc(ch ? ch.name : id) + '</h2><button class="mini x" id="k-x">关闭</button></div>' +
        '<div class="sec"><h3>现有密钥（只显示掩码）</h3>' +
          '<table class="ch" style="table-layout:auto"><thead><tr><th>#</th><th>掩码</th><th>状态</th><th style="text-align:right">操作</th></tr></thead>' +
          '<tbody>' + (rows || '<tr><td colspan="4" class="dash">没有密钥</td></tr>') + '</tbody></table>' +
          '<div class="row" style="margin-top:7px"><button class="mini" id="k-reveal">显示明文</button>' +
            '<button class="mini" id="k-allon">全部启用</button>' +
            '<button class="mini" id="k-deldb">删除所有已禁用</button>' +
            '<button class="mini" id="k-sum">状态汇总</button></div>' +
          '<div class="row" id="k-plain" hidden></div>' +
        '</div>' +
        '<div class="sec"><h3>加 Key</h3><textarea class="ta" id="k-add" placeholder="一行一个 key"></textarea>' +
          '<div class="row" style="margin-top:7px"><button class="tb tb--go" id="k-addbtn">追加</button>' +
          '<label>选择模式</label><select class="sel" id="k-mode">' +
            ['', 'random', 'round_robin'].map(function (v) {
              var t = v === '' ? '默认' : (v === 'random' ? '随机' : '轮询');
              return '<option value="' + v + '">' + t + '</option>';
            }).join('') + '</select><button class="mini" id="k-setmode">设为该模式</button></div>' +
        '</div>' +
        '<div class="foot"><button class="tb" id="k-close">关闭</button><span class="grow"></span><span class="ro" id="k-msg"></span></div>' +
      '</div>';
    $('k-x').addEventListener('click', function () { closeHost(host); });
    $('k-close').addEventListener('click', function () { closeHost(host); });
    $('k-mask').addEventListener('click', function () { closeHost(host); });
    $('k-reveal').addEventListener('click', function () {
      api('GET', '/admin/channels/keys?id=' + encodeURIComponent(id) + '&reveal=1').then(function (j2) {
        var ks = (j2 && (j2.keys || j2.items)) || [];
        /* 明文只在这里出现：渲染后**不写入 st**，下次打开面板重新取。 */
        $('k-plain').hidden = false;
        $('k-plain').innerHTML = '<span class="ro">明文（复制后请关闭本面板）：</span><br>' +
          ks.map(function (k) { return '<code>' + esc(k.key || '') + '</code>'; }).join('<br>');
      }).catch(function (e) { $('k-msg').textContent = e.message; });
    });
    $('k-allon').addEventListener('click', function () {
      api('POST', '/admin/channels/keys/status-all', { id: id, status: 1 }).then(function () { openKeys(id); })
        .catch(function (e) { $('k-msg').textContent = e.message; });
    });
    $('k-deldb').addEventListener('click', function () {
      if (!confirm('删除该渠道所有已禁用的 key？')) { return; }
      api('POST', '/admin/channels/keys/delete-disabled', { id: id }).then(function () { openKeys(id); })
        .catch(function (e) { $('k-msg').textContent = e.message; });
    });
    $('k-sum').addEventListener('click', function () {
      api('GET', '/admin/channels/keys/summary?id=' + encodeURIComponent(id)).then(function (j2) {
        $('k-msg').textContent = summarize(j2);
      }).catch(function (e) { $('k-msg').textContent = e.message; });
    });
    $('k-setmode').addEventListener('click', function () {
      api('POST', '/admin/channels/keys/mode', { id: id, key_selection_mode: $('k-mode').value })
        .then(function () { $('k-msg').textContent = '选择模式已更新'; })
        .catch(function (e) { $('k-msg').textContent = e.message; });
    });
    $('k-addbtn').addEventListener('click', function () {
      var add = splitLines($('k-add').value);
      if (!add.length) { return; }
      api('POST', '/admin/channels/keys/add', { id: id, keys: add }).then(function () { openKeys(id); })
        .catch(function (e) { $('k-msg').textContent = e.message; });
    });
    var tb = host.querySelector('tbody');
    tb.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-kact]');
      if (!b) { return; }
      var act = b.getAttribute('data-kact'), idx = Number(b.getAttribute('data-i'));
      var p;
      if (act === 'del') {
        if (!confirm('删除第 ' + idx + ' 把 key？')) { return; }
        p = api('POST', '/admin/channels/keys/delete', { id: id, index: idx });
      } else {
        p = api('POST', '/admin/channels/keys/status', { id: id, index: idx, status: act === 'on' ? 1 : 2, reason: act === 'on' ? '' : '管理端手工停用' });
      }
      p.then(function () { openKeys(id); }).catch(function (e2) { $('k-msg').textContent = e2.message; });
    });
  }).catch(function (e) { banner('err', '读取密钥失败：' + e.message); });
}

/* 标签：点列表里的标签名，或走工具栏「标签视图」。 */
function openTagActions(tag) {
  var host = $('host-flt');
  host.innerHTML =
    '<div class="mask" id="t-mask"></div>' +
    '<div class="modal calm" role="dialog" aria-label="标签操作">' +
      '<div class="dh"><h2>标签 · ' + esc(tag) + '</h2><button class="mini x" id="t-x">关闭</button></div>' +
      '<div class="sec"><h3>批量（作用于该标签下所有渠道）</h3>' +
        '<div class="row"><button class="mini" id="t-view">只看该标签</button>' +
          '<button class="mini" id="t-on">全部启用</button><button class="mini" id="t-off">全部禁用</button></div>' +
        '<div class="row"><label>优先级</label><input class="ipt ipt--sm" id="t-pri" placeholder="不改">' +
          '<label>权重</label><input class="ipt ipt--sm" id="t-wt" placeholder="不改"></div>' +
        '<div class="row"><label>分组</label><input class="ipt" id="t-groups" placeholder="逗号分隔，留空不改"></div>' +
        '<div class="row"><button class="mini tb--go" id="t-edit">应用（tag/edit）</button>' +
          '<button class="mini" id="t-fix">修复能力索引</button></div>' +
        '<div class="row"><span class="ro" id="t-msg"></span></div>' +
      '</div>' +
    '</div>';
  $('t-x').addEventListener('click', function () { closeHost(host); });
  $('t-mask').addEventListener('click', function () { closeHost(host); });
  $('t-view').addEventListener('click', function () { st.tagMode = tag; st.keyword = ''; $('flt-q').value = ''; closeHost(host); load(); });
  $('t-on').addEventListener('click', function () { tagStatus(tag, 1); });
  $('t-off').addEventListener('click', function () { tagStatus(tag, 2); });
  $('t-fix').addEventListener('click', function () {
    api('POST', '/admin/channels/fix-abilities', {}).then(function (j) { $('t-msg').textContent = '已修复：' + summarize(j); })
      .catch(function (e) { $('t-msg').textContent = e.message; });
  });
  $('t-edit').addEventListener('click', function () {
    var body = { tag: tag };
    var pri = $('t-pri').value.trim(), wt = $('t-wt').value.trim(), gs = $('t-groups').value.trim();
    if (pri !== '') { body.priority = parseInt(pri, 10) || 0; }
    if (wt !== '') { body.weight = Math.max(0, parseInt(wt, 10) || 0); }
    if (gs) { body.groups = gs.split(',').map(function (s) { return s.trim(); }).filter(function (s) { return s; }); }
    api('POST', '/admin/channels/tag/edit', body).then(function (j) { $('t-msg').textContent = '已应用：' + summarize(j); return load(); })
      .catch(function (e) { $('t-msg').textContent = e.message; });
  });
}
function tagStatus(tag, status) {
  api('POST', '/admin/channels/tag/status', { tag: tag, status: status }).then(function () { return load(); })
    .catch(function (e) { banner('err', e.message); });
}

$('btn-tagview').addEventListener('click', function () {
  api('GET', '/admin/channels/tags').then(function (j) {
    var tags = (j && (j.tags || j.items)) || [];
    var host = $('host-flt');
    var rows = tags.map(function (t) {
      var name = (typeof t === 'string') ? t : (t.tag || t.name || '');
      var cnt = (typeof t === 'string') ? '' : (' (' + (t.count || t.total || 0) + ')');
      if (!name) { return ''; }
      return '<div class="row"><button class="mini" data-tagopen="' + esc(name) + '">' + esc(name) + cnt + '</button></div>';
    }).join('');
    host.innerHTML =
      '<div class="mask" id="tv-mask"></div>' +
      '<div class="modal calm" role="dialog" aria-label="标签视图">' +
        '<div class="dh"><h2>标签视图</h2><button class="mini x" id="tv-x">关闭</button></div>' +
        '<div class="sec"><h3>全部标签</h3>' + (rows || '<span class="ro">还没有标签</span>') +
          '<div class="row" style="margin-top:7px"><button class="mini" id="tv-clear">显示全部渠道</button></div></div>' +
      '</div>';
    $('tv-x').addEventListener('click', function () { closeHost(host); });
    $('tv-mask').addEventListener('click', function () { closeHost(host); });
    $('tv-clear').addEventListener('click', function () { st.tagMode = ''; closeHost(host); load(); });
    host.querySelector('.sec').addEventListener('click', function (e) {
      var b = e.target.closest('[data-tagopen]');
      if (!b) { return; }
      closeHost(host);
      openTagActions(b.getAttribute('data-tagopen'));
    });
  }).catch(function (e) { banner('err', '读取标签失败：' + e.message); });
});

/* ── 拖动排序（先预览，再提交）────────────────────────────────────────
   位置语义照 hyxapi：before / same / after —— "same" 表示与目标同位置（同级），
   等价于插到目标之前但不改它的层级。提交前一定先给人看一遍"从哪到哪"。 */
$('btn-drag').addEventListener('click', function () {
  if (st.drag) { exitDrag(); render(); return; }
  st.order0 = st.rows.map(function (c) { return c.id; });
  st.drag = true;
  st.page = 1; render();
  this.classList.add('tb--go');
  banner('ok', '拖动排序已开启：把行拖到目标行上，松手会先预览再提交');
});
$('btn-undrag').addEventListener('click', function () {
  if (!st.order0) { return; }
  api('POST', '/admin/channels/reorder', { ids: st.order0 }).then(function () {
    st.order0 = null; exitDrag(); banner('ok', '已撤销排序'); return load();
  }).catch(function (e) { banner('err', e.message); });
});
$('ch-rows').addEventListener('dragstart', function (e) {
  var tr = e.target.closest('tr[data-id]');
  if (!tr || !st.drag) { return; }
  st.dragFrom = tr.getAttribute('data-id');
  e.dataTransfer.effectAllowed = 'move';
});
$('ch-rows').addEventListener('dragover', function (e) { if (st.drag) { e.preventDefault(); } });
$('ch-rows').addEventListener('drop', function (e) {
  if (!st.drag) { return; }
  e.preventDefault();
  var tr = e.target.closest('tr[data-id]');
  if (!tr) { return; }
  var to = tr.getAttribute('data-id');
  if (!st.dragFrom || st.dragFrom === to) { return; }
  var host = $('host-flt');
  host.innerHTML =
    '<div class="mask" id="mv-mask"></div>' +
    '<div class="modal calm" role="dialog" aria-label="确认排序">' +
      '<div class="dh"><h2>确认排序</h2><button class="mini x" id="mv-x">取消</button></div>' +
      '<div class="sec"><div class="row">把 <b class="c-id">' + esc(st.dragFrom) + '</b> 放到 <b class="c-id">' + esc(to) + '</b> 的：</div>' +
        '<div class="row"><select class="sel" id="mv-pos"><option value="before">之前（before）</option>' +
          '<option value="after">之后（after）</option><option value="same">同位（same）</option></select></div>' +
        '<div class="row"><span class="ro">提交后按新的顺序持久化优先级/位置。</span></div></div>' +
      '<div class="foot"><button class="tb tb--go" id="mv-go">提交</button><button class="tb" id="mv-cancel">取消</button></div>' +
    '</div>';
  $('mv-x').addEventListener('click', function () { closeHost(host); });
  $('mv-mask').addEventListener('click', function () { closeHost(host); });
  $('mv-cancel').addEventListener('click', function () { closeHost(host); });
  $('mv-go').addEventListener('click', function () {
    var pos = $('mv-pos').value;
    api('POST', '/admin/channels/move', { id: st.dragFrom, target_id: to, position: pos }).then(function () {
      closeHost(host); banner('ok', '顺序已更新'); st.dragFrom = null; return load();
    }).catch(function (e) { banner('err', e.message); closeHost(host); });
  });
});
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') { return; }
  closeDrawer();
  closeHost($('host-flt'));
});

/* ── 启动 ─────────────────────────────────────────────────────────────── */
function init() {
  $('ch-psize').value = String(st.psize);
  load();
}
init();
</script>
</body>
</html>
