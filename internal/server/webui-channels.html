<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>渠道管理 · 中转站</title>
<!--
  webui-channels.html —— 渠道管理页（T6）。

  # 为什么是一个独立文件，而不是塞进 webui.html
  webui.html 已经 762 KB / 12373 行。往里塞渠道界面，等于把"新功能有没有写坏主控制台"
  这个问题交给运气。独立文件的好处是可验证的：改坏了只影响这一页。
  代价是暂时要单独访问（/ui/channels），导航入口随后补。

  # 为什么用原生 JS 而不是引 amis 之类
  这一页只有一张表 + 一个表单，零依赖单文件可以直接用浏览器打开（也能挂到服务端）。
  引框架要先解决离线 SDK、构建、CSP 一堆事，收益在这一页的复杂度上体现不出来。
  ⚠ 表格按 AGENTS #5：固定行高、紧凑少空白、超长内容不撑高行。

  # 与后端的关系（全部走已有接口，前端不自己拼规则）
    GET    /admin/channels                   列表（**不回** keys 明细 ⇒ 每行只给 key_masks[] + key_count）
    POST   /admin/channels                   新建（无 id）/ 更新（带 id）
                                             ⚠ keys 是**纯字符串数组** [\"sk-...\"]，不是对象数组
                                             ⚠ name 与 base_url 必填（服务端 400 文案会点名）
                                             ⚠ 更新时不传 keys = **不改动**现有 key（不是清空）
    POST   /admin/channels/delete            删除
    POST   /admin/channels/status            停用/启用
    POST   /admin/channels/reveal            显式取明文 key
   （2026-10-21：「对外模型」页签与 /admin/channels/public-models 已按用户要求删除 ——
     它回答的问题现在由 API Key 的模型白名单 + 对外名映射回答，两处重复且后者才是对外真相）

  # 两条与需求直接对应的取舍
  ① 新增渠道的表单里**只有** Base URL + API Key 是必填 —— R3 的原话就是"只填这两个"。
     模型、映射、优先级都是"可以之后再补"的可选项，不让它们挡住第一步。
     因为管理页问的是"我配的渠道让外面看见什么"，不该取决于手里那把 key。
-->
<style>
  :root { --bd:#e3e6eb; --fg:#1f2329; --dim:#8a9099; --bg:#fff; --hover:#f6f7f9; --accent:#3370ff; }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; color:var(--fg); background:#f5f6f7; }
  header { background:var(--bg); border-bottom:1px solid var(--bd); padding:10px 16px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:15px; margin:0 12px 0 0; font-weight:600; }
  .tabs { display:flex; gap:2px; }
  .tab { padding:6px 14px; border:1px solid transparent; border-radius:6px; cursor:pointer; color:var(--dim); }
  .tab.on { background:#eef3ff; color:var(--accent); border-color:#d3e0ff; font-weight:600; }
  main { padding:12px 16px 40px; }
  .bar { display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
  input, select, textarea, button { font:inherit; border:1px solid var(--bd); border-radius:6px; padding:5px 8px; background:var(--bg); color:inherit; }
  input:focus, select:focus, textarea:focus { outline:2px solid #d3e0ff; outline-offset:0; }
  button { cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:#d83931; }
  table { width:100%; border-collapse:collapse; background:var(--bg); border:1px solid var(--bd); border-radius:8px; overflow:hidden; table-layout:fixed; }
  th, td { padding:0 10px; height:34px; line-height:34px; text-align:left; border-bottom:1px solid var(--bd); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  th { background:#fafbfc; font-weight:600; color:#4e5969; }
  tbody tr:hover { background:var(--hover); }
  tbody tr:last-child td { border-bottom:none; }
  .wrap { overflow-x:auto; }
  .tag { display:inline-block; padding:0 6px; height:20px; line-height:20px; border-radius:4px; font-size:12px; }
  .on-t { background:#e8f6ee; color:#0f8a4d; }
  .off-t { background:#f2f3f5; color:#8a9099; }
  .warn-t { background:#fff3e8; color:#d4780e; }
  .muted { color:var(--dim); }
  .err { color:#d83931; }
  dialog { border:1px solid var(--bd); border-radius:10px; padding:0; width:560px; max-width:92vw; }
  /* Key 管理独立窗口比主编辑窗宽：要同时容纳 # / 掩码 / 状态 / 两个按钮，560 会挤成一团 */
  #keysDlg { width:760px; }
  dialog::backdrop { background:rgba(0,0,0,.35); }
  .dlg-h { padding:12px 16px; border-bottom:1px solid var(--bd); font-weight:600; }
  /* ⚠ 两列 grid（96px 标签 + 1fr 控件）。**任何宽内容都必须 class="full" 跨列** ——
     否则会落进那 96px 的一列：模型勾选列表逐字换行、textarea 被压成一条竖缝。
     这不是"样式微调"，是"内容看不见"级别的 bug（模型列表与 Key 区各踩过一次）。
     max-height + overflow 也是必须的：自动发现会回填 20+ 个模型，没有内部滚动会把
     弹窗撑出屏幕，底部「取消/保存」按钮直接够不着。 */
  .dlg-b { padding:12px 16px; display:grid; grid-template-columns:96px 1fr; gap:10px 12px;
           align-items:center; align-content:start; max-height:72vh; overflow-y:auto; }
  .dlg-b .full { grid-column:1 / -1; }
  .dlg-b .hint { grid-column:1 / -1; }
  #f-vis { max-height:190px; overflow-y:auto; border:1px solid var(--bd); border-radius:6px; padding:6px 8px; }
  /* ⚠ 只收窄"选项 label"，**绝不碰 #f-choices 容器本身** —— 它是 flex-wrap，
     一旦被改成 display:block + 固定高度，20+ 个模型会被压成一行、整片看不见。
     （我第一版就写了 `#f-vis div`，正好命中那个容器 —— 收窄选择器是必须的，不是洁癖。） */
  #f-choices label { display:flex; align-items:center; gap:4px; height:22px; line-height:22px;
                     max-width:100%; white-space:nowrap; overflow:hidden; }
  #f-choices label span { overflow:hidden; text-overflow:ellipsis; }
  .dlg-b label { color:#4e5969; }
  .dlg-b .hint { grid-column:2; color:var(--dim); font-size:12px; margin-top:-6px; }
  .dlg-b textarea { min-height:64px; font-family:ui-monospace,Consolas,monospace; }
  .dlg-f { padding:12px 16px; border-top:1px solid var(--bd); display:flex; justify-content:flex-end; gap:8px; }
  .req::after { content:" *"; color:#d83931; }
</style>
</head>
<body>
<header>
  <h1>渠道管理</h1>
  <span style="flex:1"></span>
  <button onclick="load()">刷新</button>
</header>

<main>
  <!-- 渠道页签 -->
  <section id="pane-ch">
    <div class="bar">
      <button class="primary" onclick="openForm(null)">+ 新增渠道（只填 Base URL + API Key）</button>
      <span class="muted" id="stat"></span>
    </div>
    <div class="wrap"><table>
      <colgroup>
        <col style="width:150px"><col style="width:250px"><col style="width:170px">
        <col style="width:90px"><col style="width:210px"><col style="width:80px"><col style="width:160px">
      </colgroup>
      <thead><tr>
        <th>名称</th><th>Base URL</th><th>Key</th><th>模型数</th><th>映射</th><th>状态</th><th>操作</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <p class="muted" style="margin-top:8px">
      停用的渠道**不产生对外能力** —— 它声明的模型会立刻从对外目录消失，但配置留着。
      「全部 key 停用」与「渠道停用」是两件事：前者是自动进入的状态，后者是你手动关的。
    </p>
  </section>

</main>

<!-- 表单：R3 的字面要求 —— 只填 Base URL + API Key 就能建 -->
<dialog id="dlg">
  <div class="dlg-h" id="dlgTitle">新增渠道</div>
  <div class="dlg-b">
    <!-- 名称放最上面：用户第一眼要确认"我在改哪条渠道"，而不是先看到一串 URL -->
    <label class="req">名称</label>
    <input id="f-name" placeholder="留空 = 用 Base URL 主机名">
    <label class="req">Base URL</label>
    <input id="f-base" placeholder="https://api.example.com/v1">
    <label class="req">API Key</label>
    <!-- Key 表格搬到**独立窗口**（#keysDlg）：key 一多，塞在编辑弹窗里会把整页占满 ——
         用户明确要求"避免这种情况"。这里只留三件事：有多少把、进管理窗、新增时直接填。 -->
    <div class="full" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 2px">
      <span id="f-keycount" class="muted" style="font-size:12px">—</span>
      <button type="button" onclick="openKeys()" style="white-space:nowrap">管理 Key</button>
      <span class="muted" style="font-size:12px">选择模式</span>
      <select id="f-mode" style="width:180px">
        <option value="random">随机（默认）</option>
        <option value="round_robin">轮询（依次使用）</option>
      </select>
    </div>
    <textarea id="f-key" class="full" rows="2" style="min-height:0" placeholder="新增时必填，一行一个；编辑时留空 = 不改动现有 Key（要加 Key 点「管理 Key」）"></textarea>
    <label>状态</label>
    <label>模型</label>
    <input id="f-models" class="full" placeholder="逗号分隔上游真实名 —— 或点「自动发现」，在候选里勾选后点「应用勾选」" oninput="renderCandidates()">
<div class="full" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
  <button type="button" onclick="discover()" title="问上游有哪些模型。拿回来先放**候选池**，不直接写入模型栏 —— 由你勾选后应用" style="white-space:nowrap">自动发现</button>
  <input id="f-filter" placeholder="搜索候选模型…" style="width:200px" oninput="renderCandidates()">
  <div id="f-disc" class="dim" style="font-size:12px;flex:1;min-width:0"></div>
</div>
<div id="f-vis" class="full" style="margin:6px 0 0"></div>
    <div class="hint">这里写上游认识的名字；对外想换名字就用下面的映射。</div>
    <label>模型映射</label>
    <!-- 成对输入（对标 new-api 的 model_mapping 编辑器）：
         用户的原话是「希望用户填写一对数据而不是填写这种文本」——
         一行文本 "pub=upstream" 要求他会写语法、还要自己数等号，输错只能靠保存后的报错兜。
         两个输入框各填一半，语法错误从根上不存在。 -->
    <div class="full" id="f-map-rows" style="display:flex;flex-direction:column;gap:4px"></div>
    <div class="full" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button type="button" onclick="addMapRow('','')" style="white-space:nowrap;padding:0 10px;height:26px;font-size:12px">+ 添加一对</button>
      <span class="muted" style="font-size:12px">左 = 对外公开名（客户端写它）· 右 = 上游真实名 · 右侧留空即同名</span>
    </div>
    <label>优先级</label>
    <input id="f-prio" type="number" value="10" style="width:110px">
    <label>权重</label>
    <input id="f-weight" type="number" value="1" style="width:110px">
    <div class="hint">优先级高的先用；同一优先级内按权重随机（权重只影响"同档选谁"）。</div>
    <label>状态</label>
    <select id="f-status"><option value="1">启用</option><option value="2">手动停用</option></select>
  </div>
  <div class="dlg-f">
    <span class="err" id="dlgErr" style="margin-right:auto"></span>
    <button onclick="closeForm()">取消</button>
    <button class="primary" onclick="save()">保存</button>
  </div>
</dialog>

<!-- Key 管理独立窗口：key 数量多时主编辑弹窗会被撑爆，所以单独一个窗、自己滚动、自己搜索 -->
<dialog id="keysDlg">
  <div class="dlg-h">
    <span id="keysTitle">Key 管理</span>
    <span class="muted" id="keysStat" style="font-weight:400;font-size:12px;margin-left:8px"></span>
  </div>
  <div class="dlg-b" style="grid-template-columns:1fr;gap:8px">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <input id="keysFilter" placeholder="搜索（按掩码）" style="width:200px" oninput="renderKeys()">
      <span class="muted" style="font-size:12px">明文不回显；某把被上游判无效会标红，可一键恢复</span>
    </div>
    <div id="keysBody" style="max-height:52vh;overflow:auto"></div>
    <div style="display:flex;gap:8px;align-items:flex-start">
      <textarea id="keysAdd" rows="2" placeholder="一行一个 Key，追加到上面列表（重复的会自动跳过）" style="flex:1;min-height:0"></textarea>
      <button class="primary" onclick="addKeys()" style="white-space:nowrap">追加</button>
    </div>
  </div>
  <div class="dlg-f">
    <span class="err" id="keysErr" style="margin-right:auto"></span>
    <button onclick="closeKeys()">关闭</button>
  </div>
</dialog>

<script>
// ⚠ 本文件不引任何外部依赖：既能挂到服务端，也能直接用浏览器打开（填服务地址与令牌即可）。
let editing = null;   // 正在编辑的渠道 id（null = 新增）

// discover() 「模型自动发现」：拿当前表单里的 Base URL + key 去问上游有哪些模型，回填到 #f-models。
//
// ⚠ 两个刻意的行为：
//   1. 它**不保存** —— 只填栏位。抄错上游模型名是这条链路最容易出的错，所以让用户先看到真名、
//      再自己按保存，比"发现并直接落库"安全（后者会在 Base URL 写错时把错的列表写进渠道）。
//   2. key 空着就**明确说清**，不静默发一个空 key 的请求（那会拿到 401，然后用户会以为功能坏了）。
//      编辑已存在的渠道时可以不填 —— 服务端会用该渠道自己**启用中**的那个 key。
// renderCandidates() 候选池渲染：把上游返回（或手填）的候选逐个渲染成复选框，
// **勾选后点"应用"才写入模型栏** —— 默认什么都不接受，而不是默认全接受再删。
//
// ⚠ 2026-10-20 语义变更后重写：原先这里叫 renderVisible，是「对外可见」开关，靠
//   "对外 = 渠道声明 ∩ 令牌白名单"那层收紧实现。用户决定撤掉那层（改成直接展示全部）
//   ⇒ 这个控件不再控制"外部看不看得见"，它只编辑**这条渠道声明并提供哪些模型**
//   （= #f-models 那一栏的另一种编辑方式，没有独立状态）。
//   取消勾选 ⇒ 请求不再走这条渠道；不再有"取消勾选后外部立刻看不见"那层含义（那层已撤）。
//
// ⚠ 自渲染（输入框 oninput + 本函数）而不是"打开对话框时填一次"：这样它不依赖任何对话框钩子，
//   手动敲、自动发现回填、勾选切换三条路径的显示始终一致 —— 少一个"状态不同步"的洞。
// ---- 模型候选池：自动发现的结果先放这里，**勾选后**才写进模型栏 ----
//
// # 为什么改成"候选池 + 勾选 + 应用"，而不是"全部填入再取消勾选"
//
// 旧实现把上游返回的 25 个一次性写进模型栏，再用勾选去"摘掉不要的"。用户的原话是
// 「勾选哪些要不要然后填入，不是全部填入」。差别很实际：
//   全部填入 = 默认接受一切（删除是例外操作，漏了就全开）
//   候选勾选 = 默认什么都不接受（添加是显式操作，漏了只是少一个模型）
// 后者才是"我挑哪些提供服务"的正确默认值。
let discovered = [];          // 上游返回的候选（不动 #f-models）
const picked = new Set();     // 候选里被勾选的
function currentModels() {
  return document.getElementById('f-models').value.split(',').map(s => s.trim()).filter(Boolean);
}
function filteredCandidates() {
  const q = (document.getElementById('f-filter').value || '').trim().toLowerCase();
  return q ? discovered.filter(n => n.toLowerCase().indexOf(q) >= 0) : discovered;
}
function renderCandidates() {
  const box = document.getElementById('f-vis');
  if (!box) { return; }
  const cur = currentModels();
  if (!discovered.length) {
    box.innerHTML = '<div class="dim" style="font-size:12px">点「自动发现」拉取上游候选模型（拿到后由你勾选）。'
      + '这条渠道当前声明了 ' + cur.length + ' 个模型'
      + (cur.length ? '：' + esc(cur.slice(0, 8).join(', ')) + (cur.length > 8 ? ' …' : '') : '')
      + '。也可以直接在「模型」栏手填。</div>';
    return;
  }
  const shown = filteredCandidates();
  const q = (document.getElementById('f-filter').value || '').trim();
  box.innerHTML = '<div class="dim" style="font-size:12px;margin-bottom:3px">'
    + '候选 ' + discovered.length + ' 个' + (q ? '（筛出 ' + shown.length + '）' : '')
    + ' · 已勾选 <b>' + picked.size + '</b>'
    + ' <a href="#" onclick="pickAll(true);return false" style="font-size:12px;margin-left:6px">全选' + (q ? '筛选结果' : '') + '</a>'
    + ' <a href="#" onclick="pickAll(false);return false" style="font-size:12px">全不选</a>'
    + ' <button type="button" style="padding:0 8px;height:20px;line-height:18px;font-size:12px;margin-left:6px"'
    + ' onclick="applyPicked()">应用勾选 → 写入模型栏</button></div>'
    + '<div id="f-choices" style="display:flex;flex-wrap:wrap;gap:8px;font-size:13px">'
    + shown.map(n => '<label title="' + esc(n) + '"><input type="checkbox" ' + (picked.has(n) ? 'checked' : '')
      + ' onchange="pickOne(this)" data-m="' + esc(n) + '"><span>' + esc(n) + '</span></label>').join('')
    + '</div>';
}
function pickOne(cb) {
  const n = cb.getAttribute('data-m');
  if (cb.checked) { picked.add(n); } else { picked.delete(n); }
  renderCandidates();
}
// 全选/全不选只作用于**当前筛选出来的**那批（搜索后点全选，不该把看不见的也选中）
function pickAll(on) {
  filteredCandidates().forEach(n => { if (on) { picked.add(n); } else { picked.delete(n); } });
  renderCandidates();
}
function applyPicked() {
  document.getElementById('f-models').value = [...picked].join(',');
  document.getElementById('f-disc').textContent = '已把 ' + picked.size + ' 个模型写入模型栏（还没保存，记得点「保存」）';
  renderCandidates();
}

async function discover() {
  const box = document.getElementById('f-disc');
  const base = document.getElementById('f-base').value.trim();
  const key = document.getElementById('f-key').value.trim();
  if (!base) { box.textContent = '先填 Base URL（OpenAI 兼容，通常以 /v1 结尾）'; return; }
  // ⚠ 编辑已保存的渠道时，API Key 栏是空的（那个栏的约定是"留空 = 不改动现有 key"）——
  //   这时**不该**拒绝，而要带上渠道 id 让服务端用它自己存的那把 key 去问。
  //   旧版这里直接要求"去列表里点编辑"，而用户**已经在编辑弹窗里** ⇒ 死循环提示，按钮永远点不动。
  //   （服务端的 /admin/channels/discover 从 T6-① 起就支持 {id} 形态：id 取该渠道的 BaseURL 与
  //    第一个**启用**状态的 key；请求里显式给的 base_url/key 优先 ⇒ 改了地址或换了 key 也照样准。）
  if (!key && !editing) {
    box.textContent = '先填 API Key（新增渠道时必填；已保存的渠道可以不填，服务端会用存着的那把）';
    return;
  }
  box.textContent = '正在问上游…';
  try {
    const payload = { base_url: base };
    if (key) { payload.key = key; }
    if (editing) { payload.id = editing; }   // 编辑态：让服务端补上它存的 key
    const d = await api('/admin/channels/discover', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const ms = (d && d.models) || [];
    if (!ms.length) { box.textContent = '上游返回 0 个模型：确认 Base URL 指向的是 OpenAI 兼容端点（/v1）'; return; }
    // ★ 只放进候选池，**不**写模型栏 —— 用户要的是"挑完再填"，不是"全塞进去再删"。
    discovered = ms;
    picked.clear();
    // 默认勾上"这条渠道已经声明的"：重新发现时不该把已有配置悄悄丢掉；新发现的默认不勾。
    const cur = new Set(currentModels());
    ms.forEach(n => { if (cur.has(n)) { picked.add(n); } });
    document.getElementById('f-filter').value = '';
    renderCandidates();
    box.textContent = '拿到 ' + ms.length + ' 个候选（默认只勾了已声明的 ' + picked.size
      + ' 个）；挑好后点「应用勾选 → 写入模型栏」';
  } catch (e) {
    box.textContent = '自动发现失败：' + (e && e.message ? e.message : e);
  }
}

function baseURL() {
  // 这个页面已经内嵌进控制台（iframe），鉴权走会话 cookie ⇒ 恒用当前 origin。
  // 原来的"服务地址 / 管理令牌"两个输入框是**独立打开**这个页面时手填用的，
  // 内嵌之后它们只会让用户困惑（"我还要填令牌吗？"），已删除。
  return location.origin;
}
function headers() {
  // 令牌输入框已去掉：内嵌使用时靠会话 cookie（管理员登录态）鉴权。
  return { 'Content-Type': 'application/json' };
}
async function api(path, opt) {
  const r = await fetch(baseURL() + path, Object.assign({ headers: headers() }, opt || {}));
  const text = await r.text();
  let j = null; try { j = JSON.parse(text); } catch (e) {}
  if (!r.ok) throw new Error((j && (j.error || j.message)) || text.slice(0, 160) || ('HTTP ' + r.status));
  return j === null ? {} : j;
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }
// ---- 模型映射：成对输入 ----
// 为什么不用一行文本（pub=upstream）：那要求用户会写这套微语法、还要自己数等号，
// 输错只有保存后的 400 能兜。两个框各填一半 ⇒ 语法错误从根上不存在。
function addMapRow(k, v) {
  const box = document.getElementById('f-map-rows');
  if (!box) { return; }
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:6px;align-items:center';
  row.innerHTML = '<input class="m-key" placeholder="对外公开名（客户端写这个）" style="flex:1;min-width:0" value="' + esc(k) + '">'
    + '<span class="muted" style="flex:0 0 auto">→</span>'
    + '<input class="m-val" placeholder="上游真实名（右留空 = 同名）" style="flex:1;min-width:0" value="' + esc(v) + '">'
    + '<button type="button" onclick="this.parentNode.remove()" style="flex:0 0 auto;padding:0 8px;height:26px;font-size:12px">删除</button>';
  box.appendChild(row);
}
function renderMapRows(obj) {
  const box = document.getElementById('f-map-rows');
  if (!box) { return; }
  box.innerHTML = '';
  const ks = Object.keys(obj || {});
  if (!ks.length) { addMapRow('', ''); return; }   // 空的时候给一行空框，省得用户先点"添加"
  ks.forEach(k => addMapRow(k, obj[k]));
}
function collectMap() {
  const out = {};
  document.querySelectorAll('#f-map-rows > div').forEach(r => {
    const k = r.querySelector('.m-key').value.trim();
    const v = r.querySelector('.m-val').value.trim();
    if (k) { out[k] = v || k; }   // 右侧留空 = 同名（与后端"留空即名字相同"的约定一致）
  });
  return out;
}
function mapText(m) { return m && Object.keys(m).length ? Object.keys(m).map(k => esc(k) + '=' + esc(m[k])).join(', ') : '—'; }
function maskKey(k) { return k ? (k.length > 12 ? k.slice(0, 6) + '…' + k.slice(-4) : '已配置') : '—'; }

// ---- 渠道页签 ----
async function load() {
  const tbody = document.getElementById('rows');
  tbody.innerHTML = '<tr><td colspan="7" class="muted">加载中…</td></tr>';
  try {
    const d = await api('/admin/channels');
    const list = d.channels || d.data || [];
    document.getElementById('stat').textContent =
      '共 ' + list.length + ' 条 · 启用 ' + list.filter(c => c.status === 1).length + ' 条';
    if (!list.length) { tbody.innerHTML = '<tr><td colspan="7" class="muted">还没有渠道 —— 点左上「新增渠道」，只填 Base URL + API Key 即可</td></tr>'; return; }
    tbody.innerHTML = list.map(c => {
      const on = c.status === 1;
      const tag = on ? '<span class="tag on-t">启用</span>'
        : (c.status === 2 ? '<span class="tag warn-t">手动停用</span>' : '<span class="tag off-t">自动停用</span>');
      // ⚠ 列表**不回** keys 明细（那会漏明文/掩码全集），只回 key_masks[] + key_count。
      // 我第一版读 c.keys[0].mask ⇒ 这一列永远是「—」，而接口其实一直是好的。
      const km = (c.key_masks && c.key_masks.length) ? c.key_masks[0] : '';
      const key = c.key_count ? (c.key_count + ' 个 · ' + esc(maskKey(km) || '已配置')) : '—';
      const n = (c.models || []).length;
      return '<tr>'
        + '<td title="' + esc(c.name) + '">' + esc(c.name || c.id) + '</td>'
        + '<td title="' + esc(c.base_url) + '">' + esc(c.base_url) + '</td>'
        + '<td>' + key + ' <button style="padding:0 6px;height:22px;line-height:20px" onclick="reveal(\'' + esc(c.id) + '\')">显示</button></td>'
        + '<td>' + n + '</td>'
        + '<td title="' + esc(mapText(c.model_mapping)) + '">' + mapText(c.model_mapping) + '</td>'
        + '<td>' + tag + '</td>'
        + '<td>'
        + '<button style="padding:0 8px;height:22px" onclick="openForm(\'' + esc(c.id) + '\')">编辑</button> '
        + '<button style="padding:0 8px;height:22px" onclick="toggle(\'' + esc(c.id) + '\',' + (on ? 2 : 1) + ')">' + (on ? '停用' : '启用') + '</button> '
        + '<button class="danger" style="padding:0 8px;height:22px" onclick="del(\'' + esc(c.id) + '\')">删除</button>'
        + '</td></tr>';
    }).join('');
    window.__channels = list;   // 供表单读原值（避免为编辑再打一次接口）
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="7" class="err">' + esc(e.message) + '</td></tr>';
  }
}

// ---- 表单 ----
function parseMap(text) {
  const out = {};
  String(text || '').split(/\n+/).forEach(line => {
    const s = line.trim();
    if (!s || s[0] === '#') return;
    const i = s.indexOf('=');
    if (i < 0) { out[s] = s; return; }             // 只写一个名字：原样（不改变名字）
    const k = s.slice(0, i).trim(), v = s.slice(i + 1).trim();
    if (k) out[k] = v;
  });
  return out;
}
function openForm(id) {
  editing = id;
  const c = id ? (window.__channels || []).find(x => x.id === id) : null;
  document.getElementById('dlgTitle').textContent = id ? '编辑渠道' : '新增渠道';
  document.getElementById('dlgErr').textContent = '';
  document.getElementById('f-base').value = c ? (c.base_url || '') : '';
  document.getElementById('f-key').value = '';
  document.getElementById('f-key').placeholder = c
    ? '留空 = 不改动现有 Key；要加 Key 点上面「管理 Key」'
    : 'sk-...（一行一个，可多填）';
  // 候选池与 Key 状态每次打开都重置 —— 上一次的发现结果留到下一次是最典型的脏状态
  discovered = [];
  picked.clear();
  keysData = [];
  keysFor = c ? id : '';
  document.getElementById('f-mode').value = 'random';
  document.getElementById('f-filter').value = '';
  document.getElementById('f-keycount').textContent = c ? '读取中…' : '新增渠道：Key 填在下面（一行一个）';
  renderCandidates();
  if (c) { loadKeys(id); }
  document.getElementById('f-name').value = c ? (c.name || '') : '';
  document.getElementById('f-models').value = c ? (c.models || []).join(',') : '';
  renderMapRows(c ? c.model_mapping : {});
  document.getElementById('f-prio').value = c ? (c.priority != null ? c.priority : 10) : 10;
  document.getElementById('f-weight').value = c ? (c.weight != null ? c.weight : 1) : 1;
  document.getElementById('f-status').value = c ? String(c.status === 2 ? 2 : 1) : '1';
  document.getElementById('dlg').showModal();
}
function closeForm() { document.getElementById('dlg').close(); }
async function save() {
  const err = document.getElementById('dlgErr');
  err.textContent = '';
  const body = {
    id: editing || undefined,
    name: document.getElementById('f-name').value.trim(),
    base_url: document.getElementById('f-base').value.trim(),
    models: document.getElementById('f-models').value.split(',').map(s => s.trim()).filter(Boolean),
    model_mapping: collectMap(),
    priority: Number(document.getElementById('f-prio').value || 0),
    weight: Number(document.getElementById('f-weight').value || 0),
    status: Number(document.getElementById('f-status').value)
  };
  // ⚠ keys 是**纯字符串数组**（服务端 channelReq.Keys 是 []string）。
  // 这里支持**一行一个**（多 key 一次填完），服务端按内容去重。
  const rawKeys = document.getElementById('f-key').value
    .split('\n').map(s => s.trim()).filter(Boolean);
  if (rawKeys.length) body.keys = rawKeys;
  // 选择模式总是显式发送：空值在后端表示"保持原值"，那样就无法把轮询改回随机。
  const mode = document.getElementById('f-mode').value;
  if (mode) body.key_selection_mode = mode;
  // ⚠ 只在**真的填了**的时候才发 keys —— 编辑时留空意味着"不改动"，
  // 而不是"把 key 清空"（清空会让渠道静默变成不可用）。
  if (!body.base_url) { err.textContent = 'Base URL 必填'; return; }
  if (!editing && !key) { err.textContent = 'API Key 必填（新增时）'; return; }
  try { await api('/admin/channels', { method: 'POST', body: JSON.stringify(body) }); closeForm(); load(); }
  catch (e) { err.textContent = e.message; }
}
async function toggle(id, status) {
  try { await api('/admin/channels/status', { method: 'POST', body: JSON.stringify({ id: id, status: status }) }); load(); }
  catch (e) { alert(e.message); }
}
async function del(id) {
  if (!confirm('删除渠道 ' + id + ' ？它的 key 与映射会一并删除')) return;
  try { await api('/admin/channels/delete', { method: 'POST', body: JSON.stringify({ id: id }) }); load(); }
  catch (e) { alert(e.message); }
}
async function reveal(id) {
  try {
    const d = await api('/admin/channels/reveal', { method: 'POST', body: JSON.stringify({ id: id }) });
    alert('Key:\n' + (d.key || d.keys || JSON.stringify(d)));
  } catch (e) { alert(e.message); }
}

// ---- Key 管理（独立窗口）----
// 为什么独立成窗：key 会攒到几十把，表格塞在编辑弹窗里会把整页占满 —— 用户的明确要求。
// 这里只给掩码（明文走列表页的「显示」），每行可单独启停/删除。
function kEsc(s) {
  return String(s == null ? '' : s).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
}
let keysData = [];   // 当前窗口的数据（本地缓存，搜索在它上面过滤）
let keysFor = '';    // 正在管理哪个渠道
function openKeys() {
  const err = document.getElementById('keysErr');
  keysFor = editing || '';
  err.textContent = keysFor
    ? ''
    : '这条渠道还没保存 ⇒ 保存后再点「管理 Key」。新增时要填的 Key 直接写在编辑窗口下面的输入框里。';
  document.getElementById('keysTitle').textContent = 'Key 管理'
    + (keysFor ? ' · ' + (document.getElementById('f-name').value || keysFor) : '');
  document.getElementById('keysStat').textContent = '';
  document.getElementById('keysFilter').value = '';
  document.getElementById('keysAdd').value = '';
  document.getElementById('keysBody').innerHTML = '';
  document.getElementById('keysDlg').showModal();
  if (keysFor) { loadKeys(keysFor); }
}
function closeKeys() {
  document.getElementById('keysDlg').close();
  load();   // 列表页的"key 数"可能变了
}
function updateKeyCount() {
  const el = document.getElementById('f-keycount');
  if (!el) { return; }
  if (!keysFor) { el.textContent = '新增渠道：Key 填在下面（一行一个）'; return; }
  const on = keysData.filter(k => k.status === 1).length;
  el.textContent = '已存 ' + keysData.length + ' 把（启用 ' + on + '）';
}
async function loadKeys(id) {
  try {
    // reveal=1：这个窗口不是轮询的（只在打开时请求一次），所以可以拿明文 ——
    // 掩码 gk_B…4b2e 认不出是哪一把，而本窗口的用途就是"看清并管理这些 key"。
    const d = await api('/admin/channels/keys?id=' + encodeURIComponent(id) + '&reveal=1');
    keysData = (d && d.keys) || [];
    // 选择模式以这个端点为准（列表接口不回 channel_info，从那儿读会是空值 ⇒ 用户以为没设成功）
    if (d && d.key_selection_mode) { document.getElementById('f-mode').value = d.key_selection_mode; }
    renderKeys();
    updateKeyCount();
  } catch (e) {
    document.getElementById('keysErr').textContent = e.message;
    document.getElementById('keysBody').innerHTML = '';
    keysData = [];
    updateKeyCount();
  }
}
function renderKeys() {
  const body = document.getElementById('keysBody');
  const stat = document.getElementById('keysStat');
  const q = (document.getElementById('keysFilter').value || '').trim().toLowerCase();
  const rows = q ? keysData.filter(k => (k.mask || '').toLowerCase().indexOf(q) >= 0) : keysData;
  const on = keysData.filter(k => k.status === 1).length;
  stat.textContent = keysData.length
    ? '共 ' + keysData.length + ' 把 · 启用 ' + on + (q ? ' · 筛出 ' + rows.length : '')
    : '';
  if (!rows.length) {
    body.innerHTML = '<div class="muted" style="font-size:12px;padding:6px 2px">'
      + (keysData.length ? '没有匹配的 Key' : '还没有 Key —— 在下面一行一个填进去，点「追加」')
      + '</div>';
    return;
  }
  // ⚠ 按钮必须压扁：全局 button 有 5px 上下 padding ⇒ 会把 26px 的行撑到 43px。
  const bst = 'padding:0 6px;height:20px;line-height:18px;font-size:12px';
  const td = 'padding:2px 4px;height:26px;line-height:26px;border-bottom:1px solid var(--bd)';
  // Key 列要能显示**完整明文**（reveal=1 的场景），所以不能 table-layout:fixed 压死：
  // 用 auto 让它按内容撑开，其余列定宽 + nowrap。
  body.innerHTML = '<table style="width:100%;border-collapse:collapse;font-size:12px;table-layout:auto">'
    + '<thead><tr style="color:#6b7280;text-align:left">'
    + '<th style="width:34px;' + td + 'font-weight:500">#</th>'
    + '<th style="' + td + 'font-weight:500">Key</th>'
    + '<th style="width:120px;' + td + 'font-weight:500;white-space:nowrap">状态</th>'
    + '<th style="width:130px;' + td + 'font-weight:500;white-space:nowrap">操作</th>'
    + '</tr></thead><tbody>'
    + rows.map(k => {
        let st;
        if (k.status === 1) { st = '<span style="color:#059669">启用</span>'; }
        else if (k.status === 3) { st = '<span style="color:#dc2626">自动禁用</span>'; }
        else { st = '<span style="color:#6b7280">手动停用</span>'; }
        const why = k.reason === 'upstream_auth' ? '<span style="color:#9ca3af"> 上游判无效</span>' : '';
        const tg = k.status === 1
          ? '<button type="button" style="' + bst + '" onclick="keyStatus(' + k.index + ',2)">禁用</button>'
          : '<button type="button" style="' + bst + '" onclick="keyStatus(' + k.index + ',1)">启用</button>';
        return '<tr>'
          + '<td style="' + td + 'color:#9ca3af">' + k.index + '</td>'
          // 完整展示：明文时用 11px 等宽字体也让它在 700px 窗口里放得下
          + '<td style="' + td + 'font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0">' + kEsc(k.mask) + '</td>'
          + '<td style="' + td + '">' + st + why + '</td>'
          + '<td style="' + td + 'white-space:nowrap">' + tg
          + ' <button type="button" style="' + bst + '" onclick="keyDelete(' + k.index + ')">删除</button></td>'
          + '</tr>';
      }).join('')
    + '</tbody></table>';
}
async function keyStatus(idx, status) {
  try {
    await api('/admin/channels/keys/status', { method: 'POST', body: JSON.stringify({ id: keysFor, index: idx, status: status }) });
    document.getElementById('keysErr').textContent = '';
    await loadKeys(keysFor); load();
  } catch (e) { document.getElementById('keysErr').textContent = e.message; }
}
async function keyDelete(idx) {
  if (!confirm('删除第 ' + idx + ' 把 Key？（只删这一把，其余不动）')) { return; }
  try {
    await api('/admin/channels/keys/delete', { method: 'POST', body: JSON.stringify({ id: keysFor, index: idx }) });
    document.getElementById('keysErr').textContent = '';
    await loadKeys(keysFor); load();
  } catch (e) { document.getElementById('keysErr').textContent = e.message; }
}
async function addKeys() {
  const ta = document.getElementById('keysAdd');
  const err = document.getElementById('keysErr');
  const keys = ta.value.split('\n').map(s => s.trim()).filter(Boolean);
  if (!keys.length) { err.textContent = '先填 Key（一行一个）'; return; }
  try {
    const d = await api('/admin/channels/keys/add', { method: 'POST', body: JSON.stringify({ id: keysFor, keys: keys }) });
    ta.value = '';
    err.textContent = '';
    document.getElementById('keysStat').textContent = '已追加 ' + ((d && d.added) || 0) + ' 把'
      + (d && d.added === 0 ? '（都与已有重复，跳过了）' : '');
    await loadKeys(keysFor); load();
  } catch (e) { err.textContent = e.message; }
}

// ⚠ 2026-10-21：页签切换与「对外模型」页已删除（用户要求）。
//   原来这里是 `tab(true)` / `tab(false)` 两个页签 —— 删页签后若留下
//   `document.getElementById('tab-ch').onclick = ...`，那行会因元素不存在抛
//   TypeError ⇒ **整个 script 停摆** ⇒ 渠道列表一条都不加载。
//   所以不是"把 tab 藏起来"，而是把切换逻辑整段去掉。
//   页面现在直接就是渠道列表（原来 tab-ch 的默认视图）。
load();
</script>
</body>
</html>
