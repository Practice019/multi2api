name: Release

# 打 v* tag 时自动构建多平台二进制并挂到 GitHub Release。
#
# # 为什么在 CI 里构建而不是本机编译后上传
#
#   1. 干净环境 —— 产物不含作者本机的路径 / 用户名 / go module 缓存路径
#      （实测：不加 -trimpath 时二进制里会有 C:/Users/<name>/go/pkg/mod/...）
#   2. 可复现 —— 任何人 fork 后打 tag 都能得到同构产物
#   3. 交叉编译 —— 一台机器出五平台产物，无需本地装多套工具链
#   4. **唯一来源** —— 见下
#
# # 为什么强调"唯一来源"（v1.7.0 踩过的坑）
#
# v1.7.0 的 Release 上有 **7 个**资产，但实际只有 5 个平台 ——
# 因为两套命名并存：
#
#   CI 编的：  wb2api-server-windows-amd64.zip
#              wb2api-server-linux-amd64.tar.gz
#   本机编的： wb2api-server-v1.7.0-windows-amd64.zip
#              wb2api-server-v1.7.0-linux-amd64.zip
#              （还有 linux-arm64 / darwin-amd64 / darwin-arm64）
#
# 其中 windows-amd64 与 linux-amd64 **各重复了一次**，且命名风格还不一致
# （一个带版本号、一个不带；一个用 tar.gz、一个用 zip）。
# 下载的人分不清该拿哪个，两个文件的内容也可能来自不同 commit。
#
# 所以现在的约定是：
#
#   **所有平台都由本 workflow 出，本机不再手工上传任何产物。**
#   命名统一为 `wb2api-server-<goos>-<goarch>.<zip|tar.gz>`（不带版本号 ——
#   版本信息在 Release tag 与 zip 内的二进制里，文件名带版本号只会让
#   "同一个 tag 重发"产生两个名字）。
#
# # 产物
#
#   wb2api-server-windows-amd64.zip      含 exe + config.example.json + start.bat
#   wb2api-server-linux-amd64.tar.gz     含可执行文件 + config.example.json
#   wb2api-server-linux-arm64.tar.gz
#   wb2api-server-darwin-amd64.tar.gz
#   wb2api-server-darwin-arm64.tar.gz
#   SHA256SUMS.txt                       上面五者的校验和（合并成一份）
on:
  push:
    tags: ['v*']
  workflow_dispatch:      # 允许手动触发（用于测试 workflow 本身）

permissions:
  contents: write         # 需要写 Release

jobs:
  # 先过质量门禁：坏的代码不该被做成 Release 产物。
  #
  # 单独一个 job（而不是塞进 matrix）的理由：让它在**所有**平台构建之前
  # 跑一次就够。放进 matrix 会跑五遍（浪费额度），且失败的信号被埋在
  # 五个 job 的输出里。
  verify:
    name: verify before packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      # 与 ci.yml 保持一致（不跑 -race：那一步在 ci.yml 里是 advisory）。
      - name: Build / vet / test
        run: |
          go build ./...
          go vet ./...
          go test ./... -count=1

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^$' || true)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt："
            echo "$unformatted"
            exit 1
          fi
      # RELEASE_NOTES.md 是发布流水线 `--notes-file` 的**直取目标** ⇒ 它必须**只含本版内容**
      #（AGENTS.md 原话：「改 RELEASE_NOTES.md 为本版内容」）。
      #
      # # 这条门禁对应一次真实事故（v2.0.3 的对外正文）
      #
      # 发布时把新版说明**前置拼进**旧文件（而不是替换）⇒ GitHub 上那一版的正文里混进了
      # 上一版全文（两个顶层标题）。这类错**不会报错**：步骤成功、Release 也建出来了，
      # 只有下载的人会读到两版混在一起的说明 —— 而"说明"正是他判断能不能升级的依据。
      #
      # 两条判据都是"追加"形态的直接指纹：
      #   ① 顶层「# 」标题恰好 1 个（追加 ⇒ 2 个；清空或标题写成「## 」⇒ 0 个）
      #   ② 该标题必须含本次 tag（忘改标题、留着上一版 ⇒ 红）
      #
      # ⚠ 手动触发（workflow_dispatch）时 ref 是**分支名**而不是 tag ⇒ 只查 ①、不查 ②，
      #   否则"手动跑一次 workflow"必然红（与下面 release job 的
      #   `startsWith(github.ref, 'refs/tags/v')` 是同一条口径）。
      - name: Check RELEASE_NOTES.md is this version only
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -e
          FILE=RELEASE_NOTES.md
          if [ ! -s "$FILE" ]; then
            echo "::error::$FILE 缺失或为空 —— Release 正文会退化成一句模板话"
            exit 1
          fi
          # 顶层标题 = 行首「# 」（「## 」等子标题不算）。
          mapfile -t TITLES < <(grep -n '^# ' "$FILE" || true)
          if [ "${#TITLES[@]}" -ne 1 ]; then
            echo "::error::$FILE 的顶层标题必须恰好 1 个，实际 ${#TITLES[@]} 个："
            printf '  %s\n' "${TITLES[@]}"
            echo "正确做法：把这个文件改成**本版内容**（替换，不是追加）——"
            echo "  · 把上一版内容留在里面 ⇒ 会出现两个顶层标题（v2.0.3 就是这么发出去的）"
            echo "  · 整篇清空、或标题写成了「## 」⇒ 0 个"
            exit 1
          fi
          TITLE="${TITLES[0]#*:}"
          # ⚠ tag 判据必须是**等值**，不能是子串包含 —— 子串会误通：
          #   标题 `# v2.0.3 — 2026-11-12` 配 tag=v2.0 与 tag=v2 都会"通过"，
          #   而那正是这条门禁要防的那类"看起来对"（验证者实测出来的）。
          #
          # 取「tag 段」= `# ` 之后、日期分隔符之前的那一段。本仓现行形态
          # `# <tag> — <日期>`（全角破折号），另两种写法也认：
          #   `# v2.0.3 - 2026-11-12`（半角短横 + 两侧空格）/ `# v2.0.3`（没有日期）
          HEAD="${TITLE#"# "}"
          TAG_IN_TITLE="${HEAD%%[[:space:]]—*}"            # 全角破折号（含前置空格）
          TAG_IN_TITLE="${TAG_IN_TITLE%%—*}"               # 无空格的全角破折号
          TAG_IN_TITLE="${TAG_IN_TITLE%%[[:space:]]-*}"    # 半角短横（含前置空格）
          # ⚠ 无空格的短横形态（`v2.0.3-2026-11-12`）只在短横后紧跟 4 位年份时才切，
          #   免得把预发布 tag（`v2.1.0-rc1`）切坏 —— 那会造成一次**假红**。
          TAG_IN_TITLE="${TAG_IN_TITLE%%-2[0-9][0-9][0-9]-*}"
          TAG_IN_TITLE="${TAG_IN_TITLE%%[[:space:]]*}"     # 兜底：截到第一个空白
          if [ "$RELEASE_REF_TYPE" != "tag" ]; then
            echo "顶层标题：$TITLE（tag 段 = $TAG_IN_TITLE；非 tag 触发，ref=$RELEASE_TAG ⇒ 跳过 tag 一致性检查）"
            exit 0
          fi
          if [ "$TAG_IN_TITLE" != "$RELEASE_TAG" ]; then
            echo "::error::$FILE 的顶层标题与本次 tag 不一致"
            echo "  实际标题：$TITLE"
            echo "  标题里的 tag 段：$TAG_IN_TITLE"
            echo "  本次 tag：$RELEASE_TAG（要求**相等**，不是「包含」—— 例如「# v2.0.3 — 2026-11-12」）"
            echo "正确做法：把这个文件改成**本版内容**（替换，不是追加）"
            exit 1
          fi
          echo "顶层标题：$TITLE（tag 段 = $TAG_IN_TITLE，与本次 tag 相等 ✓）"

  build:
    name: build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # archive 只分两种：Windows 用 zip（双击即用），其余用 tar.gz。
          # 不按平台逐个写 zip —— 那是无谓的差异，且让"该怎么解压"
          # 变成一件要查文档的事。
          - goos: windows
            goarch: amd64
            ext: .exe
            archive: zip
          - goos: linux
            goarch: amd64
            ext: ''
            archive: tar.gz
          - goos: linux
            goarch: arm64
            ext: ''
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ''
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            ext: ''
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'          # 纯静态，产物可丢到任意同级系统上跑
        run: |
          # -trimpath 必须保留：去掉本机绝对路径与 module 缓存路径
          # -s -w 去掉符号表与 DWARF，体积约减小 30%
          go build -trimpath -ldflags="-s -w" \
            -o "dist/wb2api-server${{ matrix.ext }}" ./cmd/server

      - name: Assemble package
        run: |
          set -e
          PKG="wb2api-server-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "pkg/$PKG"
          cp "dist/wb2api-server${{ matrix.ext }}" "pkg/$PKG/"
          cp config.example.json "pkg/$PKG/"
          # Windows 包额外带上 start.bat（双击即用）。
          # 其它平台不带：那些平台的用户习惯自己写启动脚本，
          # 塞一个 .sh 进去反而要处理执行权限。
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp start.bat "pkg/$PKG/"
          fi
          cd pkg
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip -r "../$PKG.zip" "$PKG"
          else
            tar czf "../$PKG.tar.gz" "$PKG"
          fi
          cd ..
          echo "--- 产物 ---"
          ls -la

      - name: Checksums
        run: |
          # 每个 matrix job 只产出自己那一种归档（见上面的 archive 字段），
          # 所以这里不能同时 glob 两种扩展名 —— 缺的那种会被 bash 当成
          # "No such file or directory" 直接失败。
          # 改用 find 只收集实际存在的文件。
          find . -maxdepth 1 \( -name '*.zip' -o -name '*.tar.gz' \) -printf '%f\n' \
            | sort | xargs sha256sum > "SHA256SUMS-${{ matrix.goos }}-${{ matrix.goarch }}.txt"
          cat "SHA256SUMS-${{ matrix.goos }}-${{ matrix.goarch }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.zip
            *.tar.gz
            SHA256SUMS-*.txt

  release:
    name: publish release assets
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Merge checksums
        run: |
          cd artifacts
          # 把各 matrix 的校验和合成一份；文件名不写死，避免加平台时漏改
          grep -h . SHA256SUMS-*.txt | sort -k2 > SHA256SUMS.txt
          rm -f SHA256SUMS-*.txt
          echo "--- artifacts 内容 ---"
          ls -la
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release 可能已被人工创建（本仓库习惯：先建带说明的 Release，
          # 再补资产）。存在就 upload --clobber，不存在就 create。
          #
          # ⚠ `--clobber` 只覆盖**同名**资产。若历史上存在另一套命名的
          # 资产（v1.7.0 就同时有带版本号与不带版本号的两套），
          # 它们不会被清掉 —— 那种历史残留由下一步处理。
          cd artifacts
          ASSETS=$(find . -maxdepth 1 \( -name '*.zip' -o -name '*.tar.gz' -o -name 'SHA256SUMS.txt' \) -printf '%f\n' | sort)
          echo "将上传："
          echo "$ASSETS"
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，上传资产（覆盖同名）"
            echo "$ASSETS" | xargs gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "Release $TAG 不存在，创建"
            # 标题格式：`multi2api <tag>`，**只这两段**。
            #
            # ⚠ 不要写回 `WorkBuddy2API $TAG`（历史遗留名）：
            #
            #	- 仓库与服务名都是 multi2api（/healthz 的 service 字段也是）
            #	- "WorkBuddy2API" 只是**上游 fork 来源**的名字，不是本项目名
            #
            # 也不要附加主题描述（曾出现 `— 上游 4 个 → 10 个 + …` 这种）：
            # 标题该是**可检索的标识**，说明留在 notes 里。
            # Release 说明的来源：仓库根的 RELEASE_NOTES.md。
            #
            # 以前这里是**硬编码的一句话**（"自动构建产物（Windows / Linux / macOS…）"），
            # 于是每个 Release 的正文都只有 58 个字符 —— 用户原话：「那个说明补一下，
            # 现在的是空白的」。同仓库的 v1.9.20 有 1724 字符的正式说明，
            # 从 v1.10.0 起退化成了一句模板话，等于把"这一版改了什么"丢掉了。
            #
            # 现在改成读文件：发文前把这一版的说明写进 RELEASE_NOTES.md 提交。
            # ⚠ 文件缺失时回退到模板，**不是**静默发一个空 Release ——
            #   发一个 0 字符的正文比发一句模板话更糟（下载的人无从判断这版能不能升）。
            # ⚠⚠ 本步骤前面已经 `cd artifacts`（为了 find 资产），而 RELEASE_NOTES.md 在**仓库根**。
            #   所以必须回到上一级去找 —— 第一次上线时正是在这里踩的坑：
            #   在 artifacts/ 里 [ -f RELEASE_NOTES.md ] 恒假 ⇒ 静默回退模板 ⇒
            #   同时模板文案里的 "Linux" 被 shell 当通配符展开（见下），整个 publish 步骤 exit 123。
            NOTES_FILE="../RELEASE_NOTES.md"
            if [ -f "$NOTES_FILE" ] && [ -s "$NOTES_FILE" ]; then
              # ⚠ 用数组而不是字符串：模板/路径里的空格与通配符不该被 shell 二次解释。
              #   第一次上线时 `$NOTES_SOURCE` 未加引号，模板文案里的 "Linux" 被当成 glob
              #   （报 `no matches found for 'Linux'`，zsh 下直接 exit 123）。
              NOTES_ARGS=(--notes-file "../RELEASE_NOTES.md")
              echo "用 RELEASE_NOTES.md 作为 Release 说明（$(wc -c < "$NOTES_FILE") 字节）"
            else
              NOTES_ARGS=(--notes "自动构建产物（Windows / Linux / macOS，amd64 + arm64）。详见仓库 README。")
              echo "⚠ 没有 RELEASE_NOTES.md 或文件为空 ⇒ 回退到模板文案（请补说明后重发）"
            fi
            # ⚠ 不用 xargs：资产名里不会被 xargs 安全传递，且 --notes-file 与资产混在一起时
            #   xargs 会把"最后一个参数"当命令追加位置搞乱。直接把资产列表展开成参数。
            # shellcheck disable=SC2086  # ASSETS 需要按空白拆成多个资产名
            gh release create "$TAG" $ASSETS \
              --repo "$GITHUB_REPOSITORY" \
              --title "multi2api $TAG" \
              "${NOTES_ARGS[@]}"
          fi

      - name: Prune stale assets
        env:
          GH_TOKEN: ${{ github.token }}
        # 删掉"不该由本 workflow 产出"的资产残留。
        #
        # # 为什么要这一步（v1.7.0 的教训）
        #
        # 上一版的产物来自两处：本机手工编的 5 个（文件名带版本号）
        # + CI 的 2 个。于是 Release 上有 7 个资产、两个平台重复。
        # 那些手工产物在后续 tag 上不会重现，但它们在 v1.7.0 上会一直
        # 留着，让下载的人分不清哪个才是这个 tag 的产物。
        #
        # 判据：资产名必须匹配本 workflow 的命名规范。
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          echo "检查 $TAG 上的资产是否符合命名规范…"
          # 允许的名字：wb2api-server-<os>-<arch>.<zip|tar.gz> 与 SHA256SUMS.txt
          STALE=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' \
            | grep -Ev '^wb2api-server-(windows|linux|darwin)-(amd64|arm64)\.(zip|tar\.gz)$' \
            | grep -v '^SHA256SUMS\.txt$' || true)
          if [ -z "$STALE" ]; then
            echo "没有残留资产。"
            exit 0
          fi
          echo "发现命名不符的资产（可能来自旧的手工上传）："
          echo "$STALE"
          echo "$STALE" | while read -r name; do
            [ -z "$name" ] && continue
            echo "删除 $name"
            gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes
          done
          echo "清理完成。剩余资产："
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
