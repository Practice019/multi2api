services:
  wb2api:
    build: .
    container_name: workbuddy2api
    restart: unless-stopped
    # ⚠ 日志上限（2026-11-02 加）：此前无任何上限，Loomy 额度刷新死循环
    # 在 8 小时内写掉了 8.9 GB 日志，把系统盘顶到 80%、并造成持续 I/O 阻塞。
    # 50m × 3 = 单容器最多 150 MB，超出的自动轮转丢弃。
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "7863:7863"
    # ⚠ 必须显式指到目录里的配置文件：镜像的 ENTRYPOINT 硬编码了
    # `/app/config.json`（见 Dockerfile 第 37 行），而挂载点现在是**目录**。
    # Go 的 flag 包对重复出现的 -config 取**最后一次**，因此这里追加的
    # 这一个生效，无需改镜像。
    command: ["-config", "/app/config/config.json"]
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
      # ⚠ 必须挂**目录**，不能挂单文件：
      # 设置/密钥轮换的落盘是 `WriteFile(tmp) + Rename(tmp, config.json)`（原子替换）。
      # 而单文件 bind mount 在容器里是**挂载点**，rename 覆盖挂载点会被内核拒绝
      # （EBUSY: device or resource busy）；配合 :ro 连 .tmp 都写不了。
      # 这导致控制台改设置/轮换管理令牌必然保存失败。
      - ./config:/app/config
